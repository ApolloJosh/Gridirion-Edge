<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gridiron Edge · NFL Matchup Analysis</title>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ==================================================================== *
 * Gridiron Edge — NFL matchup analysis · Apollo Media
 * Data: ESPN public APIs (no key). See docs/api-notes.md.
 *
 * VERIFIED TRAPS — do not "fix" these back:
 *  - team.athletes (?enable=roster) is a FLAT array, not groups with .items
 *  - athlete stats are categories[].statistics[], each entry ONE SEASON whose
 *    .stats array is positionally parallel to the category .names array
 *  - core "defensive" yardsAllowed / pointsAllowed are 0 for all 32 teams
 *    while returning HTTP 200 — real points allowed comes from standings
 *  - the /teams list endpoint is NOT CORS-open; build the map from standings
 *  - weather has temperature + gust but NO windSpeed field
 *  - Week 1 fallback must test the MEDIAN team's games played, not the sum
 *
 * UNVERIFIED (flagged): defensive athlete stat field names. The team-level
 * feed exposes totalTackles / soloTackles / sacks / passesDefended /
 * tacklesForLoss and a separate defensiveInterceptions category, so the same
 * names are expected on athletes — but that was not probed live. statOf()
 * therefore scans every category for a list of candidate names instead of
 * trusting one, and renders "—" rather than breaking if all miss.
 * ==================================================================== */

const ESPN      = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const ESPN_V2   = "https://site.api.espn.com/apis/v2/sports/football/nfl";
const ESPN_WEB  = "https://site.web.api.espn.com/apis/common/v3/sports/football/nfl";
const ESPN_CORE = "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl";

const T = {
  turf: "#14512f", turfDark: "#0e3b22", turfDeep: "#0a2d1a", turfLight: "#1a6139",
  chalk: "#ffffff", chalkDim: "rgba(255,255,255,.38)", chalkFaint: "rgba(255,255,255,.14)",
  gold: "#ffc72c", goldDeep: "#e0a413",
  leather: "#6b3410", leatherDark: "#43200a", leatherMid: "#8b4a1c",
  ink: "#f2f7f3", inkDim: "#b6cdbd", inkFaint: "#7fa38c",
  good: "#b9e6a1", bad: "#ffab91", poor: "#ff6b5e",
};
const SHADOW = `0 2px 0 ${T.leatherDark}, 0 6px 16px rgba(0,0,0,.38)`;
const SHADOW_SM = `0 2px 0 ${T.leatherDark}`;

const DIVISION = {
  BUF:"AFC East", MIA:"AFC East", NE:"AFC East", NYJ:"AFC East",
  BAL:"AFC North", CIN:"AFC North", CLE:"AFC North", PIT:"AFC North",
  HOU:"AFC South", IND:"AFC South", JAX:"AFC South", TEN:"AFC South",
  DEN:"AFC West", KC:"AFC West", LV:"AFC West", LAC:"AFC West",
  DAL:"NFC East", NYG:"NFC East", PHI:"NFC East", WSH:"NFC East",
  CHI:"NFC North", DET:"NFC North", GB:"NFC North", MIN:"NFC North",
  ATL:"NFC South", CAR:"NFC South", NO:"NFC South", TB:"NFC South",
  ARI:"NFC West", LAR:"NFC West", SEA:"NFC West", SF:"NFC West",
};

const OFF_POS = ["QB", "RB", "FB", "WR", "TE"];
const DEF_POS = ["DE", "DT", "NT", "LB", "OLB", "ILB", "MLB", "CB", "S", "FS", "SS", "DB", "EDGE"];

/* ------------------------------ plumbing ------------------------------ */

const _cache = new Map();
async function fetchJSON(url) {
  if (_cache.has(url)) return _cache.get(url);
  const p = (async () => {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })();
  _cache.set(url, p);
  p.catch(() => _cache.delete(url));
  return p;
}
async function safeJSON(url) { try { return await fetchJSON(url); } catch { return null; } }

async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
  }));
  return out;
}

function num(v) {
  if (v === null || v === undefined) return NaN;
  const n = parseFloat(String(v).replace(/,/g, ""));
  return isNaN(n) ? NaN : n;
}
const fmt = (v, d = 1) => (isNaN(num(v)) ? "—" : num(v).toFixed(d));
const int = (v) => (isNaN(num(v)) ? "—" : String(Math.round(num(v))));
function ordinal(n) {
  if (!n || isNaN(n)) return "—";
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* ------------------------------ grading ------------------------------ */

function grade(val, thresholds, higherIsBetter = true) {
  const v = num(val);
  if (isNaN(v)) return null;
  const [elite, good, avg, bad] = thresholds;
  if (higherIsBetter) {
    if (v >= elite) return "elite";
    if (v >= good) return "good";
    if (v >= avg) return "avg";
    if (v >= bad) return "bad";
    return "poor";
  }
  if (v <= elite) return "elite";
  if (v <= good) return "good";
  if (v <= avg) return "avg";
  if (v <= bad) return "bad";
  return "poor";
}
/* On a green field, "good = green" reads poorly. Elite is gold, weak is clay. */
const GRADE_COLOR = { elite: T.gold, good: T.good, avg: T.chalk, bad: T.bad, poor: T.poor };
const gradeColor = (g) => (g ? GRADE_COLOR[g] : T.inkFaint);
const GRADE_SCORE = { elite: 1, good: 0.75, avg: 0.5, bad: 0.25, poor: 0 };

/* --------------------------- schedule --------------------------- */

async function getSchedule(year, week, seasonType) {
  const d = await fetchJSON(`${ESPN}/scoreboard?seasontype=${seasonType}&week=${week}&dates=${year}`);
  const games = (d.events || []).map((ev) => {
    const comp = ev.competitions?.[0] || {};
    const home = (comp.competitors || []).find((c) => c.homeAway === "home") || {};
    const away = (comp.competitors || []).find((c) => c.homeAway === "away") || {};
    const side = (c) => ({
      id: c.team?.id, abbr: c.team?.abbreviation, name: c.team?.displayName,
      logo: c.team?.logo, score: c.score, record: (c.records || [])[0]?.summary,
    });
    return {
      id: ev.id, name: ev.shortName || ev.name, date: ev.date,
      status: comp.status?.type?.description, state: comp.status?.type?.state,
      venue: comp.venue?.fullName, indoor: comp.venue?.indoor,
      home: side(home), away: side(away),
    };
  });
  games.sort((a, b) => new Date(a.date) - new Date(b.date));
  return { games, byes: (d.week?.teamsOnBye || []).map((t) => t.abbreviation) };
}

/* --------------------- league defensive context --------------------- */

function walkStandings(node, out = []) {
  if (!node) return out;
  if (node.standings?.entries) out.push(...node.standings.entries);
  (node.children || []).forEach((c) => walkStandings(c, out));
  return out;
}

async function getStandings(year) {
  const d = await safeJSON(`${ESPN_V2}/standings?season=${year}`);
  if (!d) return [];
  return walkStandings(d).map((e) => {
    const s = {};
    (e.stats || []).forEach((x) => { s[x.name] = x.value !== undefined ? x.value : num(x.displayValue); });
    const gp = (s.wins || 0) + (s.losses || 0) + (s.ties || 0);
    return {
      id: e.team?.id, abbr: e.team?.abbreviation, name: e.team?.displayName, gp,
      pointsAgainst: s.pointsAgainst, pointsFor: s.pointsFor,
      record: [s.wins, s.losses].filter((v) => v !== undefined).join("-") + (s.ties ? "-" + s.ties : ""),
    };
  }).filter((t) => t.abbr);
}

async function getTeamDefStats(year, teamId) {
  const d = await safeJSON(`${ESPN_CORE}/seasons/${year}/types/2/teams/${teamId}/statistics`);
  const cat = d?.splits?.categories?.find((c) => c.name === "defensive");
  const g = (n) => {
    const s = (cat?.stats || []).find((x) => x.name === n);
    return s ? num(s.value ?? s.displayValue) : NaN;
  };
  return {
    sacks: g("sacks"), passesDefended: g("passesDefended"),
    stuffs: g("stuffs"), tacklesForLoss: g("tacklesForLoss"), gp: g("teamGamesPlayed"),
  };
}

function rankBy(rows, key, higherIsBetter) {
  const valid = rows.filter((r) => !isNaN(r[key]));
  const sorted = [...valid].sort((a, b) => (higherIsBetter ? b[key] - a[key] : a[key] - b[key]));
  const map = {};
  sorted.forEach((r, i) => { map[r.abbr] = i + 1; });
  return map;
}

/**
 * Week 1 trap: after a Thursday opener two teams have a game played and thirty
 * have none, so "no games league-wide" never fires and ranks get computed off a
 * two-team sample. Test the MEDIAN team instead.
 */
function seasonHasSample(standings) {
  if (!standings.length) return false;
  const gps = standings.map((t) => t.gp || 0).sort((a, b) => a - b);
  return gps[Math.floor(gps.length / 2)] >= 4;
}

async function getLeagueDefense(year) {
  let season = year;
  let standings = await getStandings(season);
  if (!seasonHasSample(standings)) {
    const prior = await getStandings(year - 1);
    if (seasonHasSample(prior)) { season = year - 1; standings = prior; }
  }
  if (!standings.length) return null;

  const stats = await pool(standings, 8, (t) => getTeamDefStats(season, t.id));
  const rows = standings.map((t, i) => {
    const s = stats[i] || {};
    const gp = t.gp || s.gp || 1;
    return {
      abbr: t.abbr, name: t.name, record: t.record, gp,
      papg: t.pointsAgainst ? t.pointsAgainst / gp : NaN,
      ppg: t.pointsFor ? t.pointsFor / gp : NaN,
      sacksPg: isNaN(s.sacks) ? NaN : s.sacks / gp,
      pdPg: isNaN(s.passesDefended) ? NaN : s.passesDefended / gp,
      stuffsPg: isNaN(s.stuffs) ? NaN : s.stuffs / gp,
      tflPg: isNaN(s.tacklesForLoss) ? NaN : s.tacklesForLoss / gp,
    };
  });

  const rPapg = rankBy(rows, "papg", false), rSacks = rankBy(rows, "sacksPg", true),
        rPd = rankBy(rows, "pdPg", true), rStuffs = rankBy(rows, "stuffsPg", true),
        rTfl = rankBy(rows, "tflPg", true), rOff = rankBy(rows, "ppg", true);

  const wc = rows.map((r) => ({
    ...r,
    _pass: ((rSacks[r.abbr] || 16) + (rPd[r.abbr] || 16) + (rPapg[r.abbr] || 16)) / 3,
    _run:  ((rStuffs[r.abbr] || 16) + (rTfl[r.abbr] || 16) + (rPapg[r.abbr] || 16)) / 3,
  }));
  const rPass = rankBy(wc, "_pass", false), rRun = rankBy(wc, "_run", false);

  const table = {};
  wc.forEach((r) => {
    table[r.abbr] = {
      ...r, rankPapg: rPapg[r.abbr], rankSacks: rSacks[r.abbr], rankPd: rPd[r.abbr],
      rankStuffs: rStuffs[r.abbr], rankTfl: rTfl[r.abbr],
      rankPass: rPass[r.abbr], rankRun: rRun[r.abbr], rankOffense: rOff[r.abbr],
    };
  });
  return { season, table, teams: standings.length };
}

/* ------------------------------ rosters ------------------------------ */

async function getRoster(teamId) {
  const d = await safeJSON(`${ESPN}/teams/${teamId}?enable=roster`);
  const athletes = d?.team?.athletes || [];   // FLAT array
  return athletes.map((a) => ({
    id: a.id, name: a.displayName, jersey: a.jersey,
    pos: a.position?.abbreviation, active: a.active !== false,
  })).filter((a) => a.id && a.pos);
}

async function getAthleteSeason(playerId) {
  const d = await safeJSON(`${ESPN_WEB}/athletes/${playerId}/stats`);
  if (!d?.categories) return null;
  const out = { season: null };
  for (const cat of d.categories) {
    const names = cat.names || [], seasons = cat.statistics || [];
    if (!names.length || !seasons.length) continue;
    let latest = null;
    for (const s of seasons) {
      const y = s?.season?.year;
      if (y != null && (!latest || y > latest.season.year)) latest = s;
    }
    if (!latest) continue;
    const vals = {};
    names.forEach((n, i) => { vals[n] = latest.stats?.[i]; });
    out[cat.name] = vals;
    if (!out.season || latest.season.year > out.season) out.season = latest.season.year;
  }
  return out.season ? out : null;
}

/**
 * Resolve a stat by trying candidate field names across the given categories.
 * Category order matters: `interceptions` means thrown picks in `passing` and
 * caught picks in `defensiveInterceptions`, so defenders are scoped to
 * defensive categories only.
 */
function statOf(stats, categories, candidates) {
  if (!stats) return undefined;
  for (const cat of categories) {
    const block = stats[cat];
    if (!block) continue;
    for (const key of candidates) {
      if (block[key] !== undefined && block[key] !== null && block[key] !== "") return block[key];
    }
  }
  return undefined;
}
const DEF_CATS = ["defensive", "defensiveInterceptions", "general", "defensiveTackles"];
const defStat = (s, candidates) => statOf(s, DEF_CATS, candidates);

/* --------------------------- game detail --------------------------- */

async function getGameDetail(eventId) {
  const d = await safeJSON(`${ESPN}/summary?event=${eventId}`);
  if (!d) return null;
  const w = d.gameInfo?.weather || null;
  const injuries = {};
  (Array.isArray(d.injuries) ? d.injuries : []).forEach((block) => {
    const ab = block.team?.abbreviation;
    if (!ab) return;
    injuries[ab] = (block.injuries || []).map((x) => ({
      name: x.athlete?.displayName, pos: x.athlete?.position?.abbreviation,
      status: x.status, detail: x.details?.type || x.type?.description || "",
    }));
  });
  return {
    // no windSpeed on this payload — gust is the wind proxy
    weather: w ? { temp: w.temperature ?? w.highTemperature, gust: w.gust, conditionId: w.conditionId } : null,
    indoor: d.gameInfo?.venue?.indoor,
    injuries,
  };
}

/* ====================== PROJECTION ENGINE ======================
 * A projection is a season per-game baseline multiplied by a chain of
 * factors. Every factor declares itself whether or not it is modeled yet,
 * so the UI can show the full intended chain and mark what is still pending.
 * Adding a factor = push one object; nothing else changes.
 * ============================================================== */

const MATCHUP_SPREAD = 0.12;   // best defense -12%, worst +12%
const PACE_SPREAD    = 0.08;   // defensive-player volume proxy

/** rank 1 (toughest) -> 1-spread ; rank n (softest) -> 1+spread */
function rankMultiplier(rank, n, spread) {
  if (!rank || !n || n < 2) return 1;
  const mid = (n + 1) / 2;
  return 1 + spread * ((rank - mid) / ((n - 1) / 2));
}

function weatherFactor(wx, indoor, phase) {
  if (indoor) return { key: "wx", label: "Indoor — no weather effect", mult: 1, active: true };
  const temp = num(wx?.temp), gust = num(wx?.gust);
  if (isNaN(temp) && isNaN(gust)) {
    return { key: "wx", label: "Weather unavailable", mult: 1, active: false, pending: true };
  }
  let mult = 1;
  const notes = [];
  if (!isNaN(gust) && gust >= 20) { mult *= phase === "pass" ? 0.92 : 1.04; notes.push(`gusts ${Math.round(gust)}mph`); }
  else if (!isNaN(gust) && gust >= 15) { mult *= phase === "pass" ? 0.96 : 1.02; notes.push(`gusts ${Math.round(gust)}mph`); }
  if (!isNaN(temp) && temp < 25) { mult *= phase === "pass" ? 0.96 : 1.02; notes.push(`${Math.round(temp)}°F`); }
  else if (!isNaN(temp) && temp < 35) { mult *= phase === "pass" ? 0.98 : 1.01; notes.push(`${Math.round(temp)}°F`); }
  return {
    key: "wx",
    label: notes.length ? `Weather: ${notes.join(", ")}` : `Weather neutral${isNaN(temp) ? "" : ` (${Math.round(temp)}°F)`}`,
    mult, active: true,
  };
}

/**
 * Archetype is classified from production shape — the half of the idea that
 * current data supports. Defense-vs-archetype needs charting data ESPN does
 * not expose publicly (slot/wide snaps, box counts), so that factor declares
 * itself pending rather than inventing a number.
 */
function archetypeOf(pos, per) {
  if (pos === "QB") {
    if (per.rushYdsPg >= 30) return "Dual threat";
    if (per.ypa >= 8.2) return "Downfield passer";
    return "Pocket passer";
  }
  if (pos === "RB" || pos === "FB") {
    if (per.recPg >= 3.5) return "Receiving back";
    if (per.carPg >= 15 && per.ypc < 4.2) return "Bruiser";
    if (per.ypc >= 4.8) return "Explosive back";
    return "Rotational back";
  }
  if (pos === "TE") return per.tgtPg >= 6 ? "Move TE" : "In-line TE";
  if (per.ypr >= 15) return "Deep threat";
  if (per.tgtPg >= 8) return "Volume WR1";
  if (per.ypr > 0 && per.ypr < 11) return "Possession WR";
  return "Rotational WR";
}

/**
 * Build the factor chain for a player.
 * phase: "pass" | "rush" | "defense"
 */
function buildFactors({ phase, defRow, defAbbr, teams, wx, indoor, archetype }) {
  const factors = [];

  if (phase === "defense") {
    const rank = defRow?.rankOffense;
    factors.push({
      key: "pace",
      label: `${defAbbr} offense ${ordinal(rank)} in scoring`,
      mult: rankMultiplier(rank, teams, PACE_SPREAD),
      active: !!rank,
      note: "volume proxy",
    });
  } else {
    const rank = phase === "pass" ? defRow?.rankPass : defRow?.rankRun;
    factors.push({
      key: "def",
      label: `${defAbbr} ${phase === "pass" ? "pass" : "run"} defense ${ordinal(rank)} of ${teams}`,
      mult: rankMultiplier(rank, teams, MATCHUP_SPREAD),
      active: !!rank,
    });
  }

  factors.push(weatherFactor(wx, indoor, phase === "rush" ? "rush" : "pass"));

  factors.push({
    key: "time", label: "Kickoff window / game script", mult: 1,
    active: false, pending: true, note: "not yet modeled",
  });
  factors.push({
    key: "arch", label: `Defense vs ${archetype || "archetype"}`, mult: 1,
    active: false, pending: true, note: "needs charting data",
  });

  return factors;
}

const chainMultiplier = (factors) =>
  factors.filter((f) => f.active && !isNaN(f.mult)).reduce((a, f) => a * f.mult, 1);

function project(baseline, factors) {
  const m = chainMultiplier(factors);
  const out = {};
  Object.entries(baseline).forEach(([k, v]) => { out[k] = isNaN(v) ? NaN : v * m; });
  out._mult = m;
  return out;
}

function edgeScore(playerGrades, defRank, teams = 32) {
  const gs = playerGrades.filter(Boolean).map((g) => GRADE_SCORE[g]);
  if (!gs.length) return null;
  const player = gs.reduce((a, b) => a + b, 0) / gs.length;
  const softness = defRank ? (defRank - 1) / Math.max(1, teams - 1) : 0.5;
  return Math.round((player * 0.6 + softness * 0.4) * 100);
}
function edgeVerdict(score) {
  if (score === null) return { label: "No data", tone: "neutral" };
  if (score >= 72) return { label: "Smash spot", tone: "hot" };
  if (score >= 58) return { label: "Lean", tone: "warm" };
  if (score >= 42) return { label: "Neutral", tone: "neutral" };
  if (score >= 28) return { label: "Soft fade", tone: "cool" };
  return { label: "Fade", tone: "cold" };
}

/* ------------------------------ UI atoms ------------------------------ */

const TONES = {
  hot:     { bg: "rgba(255,199,44,.16)",  bd: "rgba(255,199,44,.55)",  fg: T.gold },
  warm:    { bg: "rgba(185,230,161,.13)", bd: "rgba(185,230,161,.4)",  fg: T.good },
  neutral: { bg: "rgba(255,255,255,.07)", bd: T.chalkFaint,            fg: T.inkDim },
  cool:    { bg: "rgba(255,171,145,.13)", bd: "rgba(255,171,145,.4)",  fg: T.bad },
  cold:    { bg: "rgba(255,107,94,.15)",  bd: "rgba(255,107,94,.5)",   fg: T.poor },
  leather: { bg: "rgba(107,52,16,.42)",   bd: "rgba(139,74,28,.7)",    fg: "#f0c9a8" },
};

function Badge({ label, tone = "neutral", icon }) {
  const t = TONES[tone] || TONES.neutral;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 5, background: t.bg,
      border: `1px solid ${t.bd}`, borderRadius: 3, padding: "3px 8px",
      fontSize: 10, color: t.fg, whiteSpace: "nowrap", fontWeight: 500,
    }}>{icon && <span>{icon}</span>}{label}</span>
  );
}

/** White chalk rule, like a yard line. */
const ChalkLine = ({ opacity = 1, style }) => (
  <div style={{ height: 1, background: T.chalkDim, opacity, ...style }} />
);

function Panel({ children, style, className = "" }) {
  return (
    <div className={`card ${className}`} style={{
      background: "linear-gradient(180deg, rgba(10,45,26,.82), rgba(10,45,26,.94))",
      border: `1px solid ${T.chalkFaint}`, borderRadius: 5,
      boxShadow: SHADOW, ...style,
    }}>{children}</div>
  );
}

function SectionTitle({ children, right }) {
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{
        display: "flex", alignItems: "baseline", gap: 9, flexWrap: "wrap",
        fontFamily: "'Barlow Condensed',sans-serif", fontSize: 15, fontWeight: 700,
        letterSpacing: 1.6, color: T.chalk, textTransform: "uppercase",
      }}>
        {children}
        {right && <span style={{
          fontFamily: "'Inter',sans-serif", fontSize: 10, letterSpacing: 0,
          fontWeight: 500, color: T.inkFaint, textTransform: "none",
        }}>{right}</span>}
      </div>
      <div className="hash" style={{ marginTop: 5 }} />
    </div>
  );
}

/** One season-stat readout. */
function Stat({ label, value, g, sub }) {
  return (
    <div style={{ minWidth: 62 }}>
      <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: .5, fontWeight: 500 }}>{label}</div>
      <div style={{
        fontFamily: "'Barlow Condensed',sans-serif", fontSize: 20, fontWeight: 700,
        lineHeight: 1.15, color: gradeColor(g), letterSpacing: .5,
      }}>{value}</div>
      {sub && <div style={{ fontSize: 9, color: T.inkFaint }}>{sub}</div>}
    </div>
  );
}

/** Projected line — gold, on a leather plate. */
function ProjStat({ label, value, delta }) {
  return (
    <div style={{ minWidth: 74 }}>
      <div style={{ fontSize: 9, color: "#e8c9ac", letterSpacing: .5, fontWeight: 500 }}>{label}</div>
      <div style={{
        fontFamily: "'Barlow Condensed',sans-serif", fontSize: 23, fontWeight: 700,
        lineHeight: 1.1, color: T.gold, letterSpacing: .5,
      }}>{value}</div>
      {delta !== undefined && !isNaN(delta) && (
        <div style={{ fontSize: 9, color: delta >= 0 ? T.good : T.bad }}>
          {delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(1)}% vs avg
        </div>
      )}
    </div>
  );
}

function FactorChain({ factors }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 9 }}>
      {factors.map((f) => {
        const pending = f.pending || !f.active;
        const pct = f.active && !isNaN(f.mult) ? (f.mult - 1) * 100 : null;
        return (
          <span key={f.key} title={f.note || ""} style={{
            display: "inline-flex", alignItems: "center", gap: 6,
            background: pending ? "rgba(255,255,255,.04)" : "rgba(0,0,0,.28)",
            border: `1px dashed ${pending ? T.chalkFaint : "transparent"}`,
            borderLeft: pending ? undefined : `2px solid ${pct > 0 ? T.gold : pct < 0 ? T.bad : T.chalkDim}`,
            borderRadius: 3, padding: "3px 8px", fontSize: 10,
            color: pending ? T.inkFaint : T.inkDim,
          }}>
            <span>{f.label}</span>
            <strong style={{
              fontFamily: "'Barlow Condensed',sans-serif", fontSize: 13, letterSpacing: .4,
              color: pending ? T.inkFaint : pct > 0 ? T.gold : pct < 0 ? T.bad : T.chalk,
            }}>
              {pending ? (f.note || "pending") : `×${f.mult.toFixed(3)}`}
            </strong>
          </span>
        );
      })}
    </div>
  );
}

/* --------------------------- the player card --------------------------- */

function PlayerCard({ p, defAbbr, defRow, teams, wx, indoor, kind }) {
  const s = p.stats || {};
  const passing = s.passing || {}, rushing = s.rushing || {}, receiving = s.receiving || {};

  const gpOf = (blk) => num(blk.gamesPlayed);
  let gp = gpOf(passing) || gpOf(rushing) || gpOf(receiving);
  if (kind === "DEF") gp = num(defStat(s, ["gamesPlayed", "teamGamesPlayed"]));
  const G = gp && gp > 0 ? gp : NaN;

  let per = {}, seasonCells = [], baseline = {}, projLabels = [], grades = [], phase = "pass";

  if (kind === "QB") {
    phase = "pass";
    const att = num(passing.passingAttempts), yds = num(passing.passingYards),
          td = num(passing.passingTouchdowns), ints = num(passing.interceptions),
          rtg = num(passing.QBRating), ypa = num(passing.yardsPerPassAttempt),
          cmp = num(passing.completionPct), rush = num(rushing.rushingYards);
    per = { ypg: yds / G, tdPg: td / G, ypa, rushYdsPg: rush / G };
    const tdPct = att ? (td / att) * 100 : NaN, intPct = att ? (ints / att) * 100 : NaN;
    const g1 = grade(yds / G, [285, 250, 215, 180]), g2 = grade(rtg, [100, 90, 80, 70]),
          g3 = grade(ypa, [8.2, 7.4, 6.7, 6.0]), g4 = grade(cmp, [68, 64, 60, 56]),
          g5 = grade(tdPct, [6, 4.8, 3.8, 2.8]), g6 = grade(intPct, [1.4, 2, 2.6, 3.2], false);
    grades = [g1, g2, g3, g4, g5, g6];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 },       /* requested */
      { label: "RTG", value: fmt(rtg), g: g2 },
      { label: "YPA", value: fmt(ypa), g: g3 },
      { label: "CMP%", value: isNaN(cmp) ? "—" : fmt(cmp) + "%", g: g4 },
      { label: "TD%", value: isNaN(tdPct) ? "—" : tdPct.toFixed(1) + "%", g: g5 },
      { label: "INT%", value: isNaN(intPct) ? "—" : intPct.toFixed(1) + "%", g: g6 },
      { label: "TD/G", value: fmt(td / G) },
      { label: "RUSH/G", value: fmt(rush / G) },
    ];
    baseline = { passYds: yds / G, passTd: td / G, ints: ints / G, rushYds: rush / G };
    projLabels = [
      { key: "passYds", label: "PASS YDS", d: 1 },
      { key: "passTd", label: "PASS TD", d: 2 },
      { key: "ints", label: "INT", d: 2 },
      { key: "rushYds", label: "RUSH YDS", d: 1 },
    ];
  } else if (kind === "REC") {
    phase = "pass";
    const rec = num(receiving.receptions), yds = num(receiving.receivingYards),
          tgt = num(receiving.receivingTargets), td = num(receiving.receivingTouchdowns),
          ypr = num(receiving.yardsPerReception);
    per = { ypr, tgtPg: tgt / G, recPg: rec / G };
    const g1 = grade(yds / G, [80, 60, 42, 28]), g2 = grade(tgt / G, [8.5, 6.5, 4.5, 3]),
          g3 = grade(ypr, [15, 12.5, 10.5, 8.5]), g4 = grade(rec / G, [6, 4.5, 3, 2]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 },
      { label: "TGT/G", value: fmt(tgt / G), g: g2 },
      { label: "REC/G", value: fmt(rec / G), g: g4 },
      { label: "YPR", value: fmt(ypr), g: g3 },
      { label: "TD", value: int(td) },
      { label: "YDS", value: int(yds), sub: isNaN(G) ? "" : `${int(G)}g` },
    ];
    baseline = { recYds: yds / G, rec: rec / G, tgt: tgt / G, td: td / G };
    projLabels = [
      { key: "recYds", label: "REC YDS", d: 1 },
      { key: "rec", label: "REC", d: 1 },
      { key: "tgt", label: "TGT", d: 1 },
      { key: "td", label: "TD", d: 2 },
    ];
  } else if (kind === "RB") {
    phase = "rush";
    const car = num(rushing.rushingAttempts), yds = num(rushing.rushingYards),
          ypc = num(rushing.yardsPerRushAttempt), td = num(rushing.rushingTouchdowns),
          rec = num(receiving.receptions), recYds = num(receiving.receivingYards);
    per = { carPg: car / G, ypc, recPg: rec / G };
    const g1 = grade(yds / G, [90, 70, 50, 32]), g2 = grade(car / G, [18, 14, 10, 6]),
          g3 = grade(ypc, [5, 4.5, 4.1, 3.7]), g4 = grade(rec / G, [4, 2.5, 1.5, .8]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 },
      { label: "CAR/G", value: fmt(car / G), g: g2 },
      { label: "YPC", value: fmt(ypc), g: g3 },
      { label: "REC/G", value: fmt(rec / G), g: g4 },
      { label: "TD", value: int(td) },
      { label: "YDS", value: int(yds), sub: isNaN(G) ? "" : `${int(G)}g` },
    ];
    baseline = { rushYds: yds / G, car: car / G, td: td / G, recYds: recYds / G };
    projLabels = [
      { key: "rushYds", label: "RUSH YDS", d: 1 },
      { key: "car", label: "CAR", d: 1 },
      { key: "td", label: "RUSH TD", d: 2 },
      { key: "recYds", label: "REC YDS", d: 1 },
    ];
  } else { /* DEF */
    phase = "defense";
    const tkl = num(defStat(s, ["totalTackles", "tackles", "combinedTackles"])),
          solo = num(defStat(s, ["soloTackles", "unassistedTackles"])),
          sacks = num(defStat(s, ["sacks", "totalSacks"])),
          ints = num(defStat(s, ["interceptions", "defensiveInterceptions", "totalInterceptions"])),
          pd = num(defStat(s, ["passesDefended", "passesBattedDown"])),
          tfl = num(defStat(s, ["tacklesForLoss", "totalTacklesForLoss"])),
          ff = num(defStat(s, ["fumblesForced", "defensiveFumblesForced"]));
    per = {};
    const g1 = grade(tkl / G, [7, 5.5, 4, 2.5]), g2 = grade(sacks / G, [.7, .45, .25, .1]),
          g3 = grade(ints / G, [.3, .18, .09, .03]), g4 = grade(pd / G, [1, .6, .35, .15]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "TKL/G", value: fmt(tkl / G), g: g1 },
      { label: "SACK/G", value: fmt(sacks / G, 2), g: g2 },
      { label: "INT/G", value: fmt(ints / G, 2), g: g3 },
      { label: "PD/G", value: fmt(pd / G, 2), g: g4 },
      { label: "TKL", value: int(tkl), sub: isNaN(G) ? "" : `${int(G)}g` },
      { label: "SACKS", value: fmt(sacks, 1) },
      { label: "INT", value: int(ints) },
      { label: "TFL", value: int(tfl) },
      { label: "FF", value: int(ff) },
    ];
    baseline = { tkl: tkl / G, sacks: sacks / G, ints: ints / G, pd: pd / G };
    projLabels = [
      { key: "tkl", label: "TACKLES", d: 1 },
      { key: "sacks", label: "SACKS", d: 2 },
      { key: "ints", label: "INT", d: 2 },
      { key: "pd", label: "PD", d: 2 },
    ];
  }

  const archetype = kind === "DEF" ? null : archetypeOf(p.pos, per);
  const factors = buildFactors({ phase, defRow, defAbbr, teams, wx, indoor, archetype });
  const projected = project(baseline, factors);
  const deltaPct = (projected._mult - 1) * 100;

  const defRank = kind === "DEF" ? defRow?.rankOffense
    : phase === "rush" ? defRow?.rankRun : defRow?.rankPass;
  const score = edgeScore(grades, defRank, teams);
  const verdict = edgeVerdict(score);
  const hasAny = seasonCells.some((c) => c.value !== "—");

  return (
    <Panel style={{ marginBottom: 10, overflow: "hidden" }}>
      {/* header */}
      <div style={{
        display: "flex", alignItems: "center", gap: 10, padding: "9px 13px",
        background: "rgba(0,0,0,.22)", flexWrap: "wrap",
      }}>
        <span style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 12, fontWeight: 700,
          color: T.turfDeep, background: T.chalk, borderRadius: 2, padding: "1px 6px",
          letterSpacing: .5, boxShadow: SHADOW_SM,
        }}>{p.jersey ? `#${p.jersey}` : p.pos}</span>
        <span style={{ fontWeight: 600, fontSize: 14, color: T.chalk }}>{p.name}</span>
        <span style={{ fontSize: 10, color: T.inkFaint }}>
          {p.pos} · {p.stats?.season || "—"} season
        </span>
        {archetype && <Badge label={archetype} tone="leather" />}
        {p.injury && <Badge label={`${p.injury.status}`} tone={/out|doubtful/i.test(p.injury.status) ? "cold" : "cool"} />}
        <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{
            fontFamily: "'Barlow Condensed',sans-serif", fontSize: 25, fontWeight: 700,
            color: TONES[verdict.tone].fg, lineHeight: 1,
          }}>{score === null ? "—" : score}</span>
          <Badge label={verdict.label} tone={verdict.tone} />
        </span>
      </div>
      <ChalkLine />

      {!hasAny && (
        <div style={{ padding: "12px 13px", fontSize: 11, color: T.inkFaint }}>
          No {kind === "DEF" ? "defensive" : ""} stats returned for this player.
        </div>
      )}

      {hasAny && (
        <>
          {/* SEASON */}
          <div style={{ padding: "11px 13px 12px" }}>
            <div style={{
              fontSize: 9, letterSpacing: 1.4, color: T.inkFaint,
              fontWeight: 600, marginBottom: 8,
            }}>SEASON — WHAT HE'S ACTUALLY DONE</div>
            <div style={{ display: "flex", gap: 18, flexWrap: "wrap" }}>
              {seasonCells.map((c, i) => <Stat key={i} {...c} />)}
            </div>
          </div>

          {/* PROJECTION */}
          <div style={{
            padding: "11px 13px 13px",
            background: "linear-gradient(180deg, rgba(107,52,16,.30), rgba(67,32,10,.42))",
            borderTop: `1px solid ${T.chalkFaint}`,
          }}>
            <div style={{
              display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap", marginBottom: 8,
            }}>
              <span style={{ fontSize: 9, letterSpacing: 1.4, color: "#e8c9ac", fontWeight: 600 }}>
                PROJECTED LINE vs {defAbbr}
              </span>
              <span style={{ fontSize: 9, color: "#c9a583" }}>
                season baseline × {projected._mult.toFixed(3)}
              </span>
            </div>
            <div style={{ display: "flex", gap: 22, flexWrap: "wrap" }}>
              {projLabels.map((l) => (
                <ProjStat key={l.key} label={l.label}
                  value={isNaN(projected[l.key]) ? "—" : projected[l.key].toFixed(l.d)}
                  delta={isNaN(projected[l.key]) ? undefined : deltaPct} />
              ))}
            </div>
            <FactorChain factors={factors} />
          </div>
        </>
      )}
    </Panel>
  );
}

/* --------------------------- defense summary --------------------------- */

function DefenseCard({ def, defAbbr, season }) {
  if (!def) return null;
  const item = (label, rank, val) => (
    <div style={{ minWidth: 96 }}>
      <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: .5, marginBottom: 3 }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
        <span style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 21, fontWeight: 700,
          color: rank <= 10 ? T.poor : rank >= 23 ? T.gold : T.chalk,
        }}>{ordinal(rank)}</span>
        <span style={{ fontSize: 10, color: T.inkFaint }}>{val}</span>
      </div>
    </div>
  );
  return (
    <Panel style={{ padding: "12px 14px", marginBottom: 14 }}>
      <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: .8, marginBottom: 10 }}>
        {defAbbr} DEFENSE · {season} RANKS <span style={{ color: T.inkFaint }}>(1 = toughest, 32 = softest)</span>
      </div>
      <div style={{ display: "flex", gap: 22, flexWrap: "wrap" }}>
        {item("PTS ALLOWED", def.rankPapg, isNaN(def.papg) ? "—" : def.papg.toFixed(1) + "/g")}
        {item("PASS D", def.rankPass, isNaN(def.sacksPg) ? "—" : def.sacksPg.toFixed(1) + " sk/g")}
        {item("RUN D", def.rankRun, isNaN(def.stuffsPg) ? "—" : def.stuffsPg.toFixed(1) + " stf/g")}
        {item("COVERAGE", def.rankPd, isNaN(def.pdPg) ? "—" : def.pdPg.toFixed(1) + " pd/g")}
        {item("PRESSURE", def.rankSacks, isNaN(def.tflPg) ? "—" : def.tflPg.toFixed(1) + " tfl/g")}
      </div>
      <div style={{ fontSize: 9, color: T.inkFaint, marginTop: 10, lineHeight: 1.5 }}>
        Points allowed is total defense, not split pass/rush. Pass D and Run D are composites of
        sack, coverage and run-stuff rates — directional, not DVOA.
      </div>
    </Panel>
  );
}

/* ------------------------------ game view ------------------------------ */

function GameView({ game, league }) {
  const [side, setSide] = useState("home");
  const [detail, setDetail] = useState(null);
  const [groups, setGroups] = useState({ QB: [], REC: [], RB: [], DEF: [] });
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const reqId = useRef(0);

  const off = side === "home" ? game.home : game.away;
  const def = side === "home" ? game.away : game.home;
  const defRow = league?.table?.[def.abbr];
  const teams = league?.teams || 32;

  useEffect(() => { getGameDetail(game.id).then(setDetail); }, [game.id]);

  useEffect(() => {
    const my = ++reqId.current;
    setLoading(true); setErr(null); setGroups({ QB: [], REC: [], RB: [], DEF: [] });

    (async () => {
      try {
        const [offRoster, defRoster] = await Promise.all([getRoster(off.id), getRoster(def.id)]);
        if (!offRoster.length) throw new Error("roster unavailable");

        const offWant = offRoster.filter((p) => OFF_POS.includes(p.pos));
        const defWant = defRoster.filter((p) => DEF_POS.includes(p.pos));
        const all = [...offWant, ...defWant];
        const stats = await pool(all, 8, (p) => getAthleteSeason(p.id));
        if (my !== reqId.current) return;

        const offInj = detail?.injuries?.[off.abbr] || [];
        const defInj = detail?.injuries?.[def.abbr] || [];
        const decorate = (p, i, inj) => ({
          ...p, stats: stats[i], injury: inj.find((x) => x.name === p.name) || null,
        });
        const offPlayers = offWant.map((p, i) => decorate(p, i, offInj)).filter((p) => p.stats);
        const defPlayers = defWant.map((p, i) => decorate(p, offWant.length + i, defInj)).filter((p) => p.stats);

        const v = (p, cat, key) => num(p.stats?.[cat]?.[key]) || 0;
        const dv = (p, names) => num(defStat(p.stats, names)) || 0;

        setGroups({
          QB: offPlayers.filter((p) => p.pos === "QB")
            .sort((a, b) => v(b, "passing", "passingAttempts") - v(a, "passing", "passingAttempts")).slice(0, 2),
          REC: offPlayers.filter((p) => ["WR", "TE"].includes(p.pos))
            .sort((a, b) => v(b, "receiving", "receivingYards") - v(a, "receiving", "receivingYards")).slice(0, 5),
          RB: offPlayers.filter((p) => ["RB", "FB"].includes(p.pos))
            .sort((a, b) => v(b, "rushing", "rushingAttempts") - v(a, "rushing", "rushingAttempts")).slice(0, 3),
          DEF: defPlayers
            .sort((a, b) => dv(b, ["totalTackles", "tackles", "combinedTackles"])
                          - dv(a, ["totalTackles", "tackles", "combinedTackles"])).slice(0, 6),
        });
        setLoading(false);
      } catch (e) {
        if (my !== reqId.current) return;
        setErr(e.message); setLoading(false);
      }
    })();
  }, [game.id, side, off.id, def.id, detail]);

  const when = useMemo(() => {
    const d = new Date(game.date);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })
      + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }, [game.date]);

  const wx = detail?.weather;
  const indoor = game.indoor || detail?.indoor;
  const temp = num(wx?.temp), gust = num(wx?.gust);
  const divisional = DIVISION[game.home.abbr] && DIVISION[game.home.abbr] === DIVISION[game.away.abbr];
  const offInjuries = detail?.injuries?.[off.abbr] || [];

  const common = { defAbbr: def.abbr, defRow, teams, wx, indoor };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      {/* scoreboard header */}
      <div style={{ flexShrink: 0, marginBottom: 13 }}>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 34, fontWeight: 700,
          letterSpacing: 1.5, lineHeight: 1.05, color: T.chalk,
          textShadow: `0 2px 0 ${T.leatherDark}, 0 4px 12px rgba(0,0,0,.5)`,
        }}>
          {game.away.abbr} <span style={{ color: T.gold, fontSize: 21, fontWeight: 400 }}>at</span> {game.home.abbr}
        </div>
        <div style={{ fontSize: 11.5, color: T.inkDim, marginTop: 3 }}>
          {when} · {game.venue || "TBD"}
          {game.away.record && ` · ${game.away.abbr} ${game.away.record}, ${game.home.abbr} ${game.home.record || ""}`}
        </div>
        <div style={{ display: "flex", gap: 7, marginTop: 9, flexWrap: "wrap" }}>
          {!indoor && !isNaN(gust) && gust >= 15 &&
            <Badge icon="💨" label={`Gusts ${Math.round(gust)} mph — passing suppressed`} tone="cold" />}
          {!indoor && !isNaN(temp) && temp < 35 &&
            <Badge icon="🧊" label={`${Math.round(temp)}°F`} tone="cold" />}
          {!indoor && !isNaN(temp) && temp >= 35 && (isNaN(gust) || gust < 15) &&
            <Badge icon="🌤" label={`${Math.round(temp)}°F${isNaN(gust) ? "" : `, gusts ${Math.round(gust)}`}`} />}
          {indoor && <Badge icon="🏟" label="Indoor — no weather factor" />}
          {divisional && <Badge icon="⚔" label={`Divisional (${DIVISION[game.home.abbr]}) — trends under`} tone="leather" />}
          {game.state && game.state !== "pre" && <Badge label={game.status} />}
        </div>
      </div>

      {/* side toggle */}
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexShrink: 0, flexWrap: "wrap" }}>
        {[["away", game.away, game.home], ["home", game.home, game.away]].map(([s, o, d]) => (
          <button key={s} onClick={() => setSide(s)} style={{
            padding: "8px 15px", fontSize: 12.5, fontWeight: 700, borderRadius: 3, cursor: "pointer",
            background: side === s ? T.gold : "rgba(0,0,0,.3)",
            color: side === s ? T.leatherDark : T.ink,
            border: `1px solid ${side === s ? T.gold : T.chalkDim}`,
            fontFamily: "'Barlow Condensed',sans-serif", letterSpacing: .8,
            boxShadow: side === s ? SHADOW_SM : "none",
          }}>
            {o.name} <span style={{ opacity: .7, fontSize: 10 }}>offense vs {d.abbr} D</span>
          </button>
        ))}
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingRight: 5 }}>
        <DefenseCard def={defRow} defAbbr={def.abbr} season={league?.season} />

        {offInjuries.length > 0 && (
          <Panel style={{ padding: "11px 14px", marginBottom: 14 }}>
            <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: .8, marginBottom: 8 }}>
              {off.abbr} INJURY REPORT
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {offInjuries.slice(0, 12).map((x, i) => (
                <Badge key={i} tone={/out|doubtful/i.test(x.status) ? "cold" : "neutral"}
                  label={`${x.name}${x.pos ? ` (${x.pos})` : ""} — ${x.status}`} />
              ))}
            </div>
          </Panel>
        )}

        {err && <div style={{ color: T.poor, fontSize: 12, padding: "10px 0" }}>Could not load: {err}</div>}
        {loading && (
          <div style={{
            textAlign: "center", padding: 40, color: T.inkDim,
            fontFamily: "'Barlow Condensed',sans-serif", fontSize: 17, letterSpacing: 2.5,
          }}>LOADING ROSTERS & SEASON STATS…</div>
        )}

        {!loading && (
          <>
            <SectionTitle right={`vs ${def.abbr} pass D · ${ordinal(defRow?.rankPass)}`}>
              🎯 Quarterback
            </SectionTitle>
            {groups.QB.map((p) => <PlayerCard key={p.id} p={p} kind="QB" {...common} />)}

            <SectionTitle right={`vs ${def.abbr} secondary · ${ordinal(defRow?.rankPass)}`}>
              ⚡ Receivers &amp; Tight Ends
            </SectionTitle>
            {groups.REC.map((p) => <PlayerCard key={p.id} p={p} kind="REC" {...common} />)}

            <SectionTitle right={`vs ${def.abbr} run D · ${ordinal(defRow?.rankRun)}`}>
              🏃 Running Backs
            </SectionTitle>
            {groups.RB.map((p) => <PlayerCard key={p.id} p={p} kind="RB" {...common} />)}

            <SectionTitle right={`vs ${off.abbr} offense · ${ordinal(defRow?.rankOffense)} scoring`}>
              🛡 {def.abbr} Defenders
            </SectionTitle>
            {groups.DEF.length === 0 && (
              <Panel style={{ padding: "12px 14px", fontSize: 11, color: T.inkDim, marginBottom: 10 }}>
                No defensive stats returned. ESPN's athlete feed exposes defensive fields under
                names this build infers rather than verified — see docs/api-notes.md.
              </Panel>
            )}
            {groups.DEF.map((p) => <PlayerCard key={p.id} p={p} kind="DEF" {...common} />)}

            <div style={{ fontSize: 10, color: T.inkFaint, lineHeight: 1.6, padding: "4px 0 22px" }}>
              Projections are a season per-game baseline times the factor chain shown on each card.
              Matchup uses league rank, capped at ±{Math.round(MATCHUP_SPREAD * 100)}%. Kickoff script and
              defense-vs-archetype are declared but not yet modeled. Price everything against your book's line.
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* --------------------------------- app --------------------------------- */

function App() {
  const now = new Date();
  const defaultYear = now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear();
  const [year, setYear] = useState(defaultYear);
  const [seasonType, setSeasonType] = useState(2);
  const [week, setWeek] = useState(null);
  const [sched, setSched] = useState({ games: [], byes: [] });
  const [selected, setSelected] = useState(null);
  const [league, setLeague] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      const d = await safeJSON(`${ESPN}/scoreboard`);
      setWeek(d?.week?.number || 1);
      if (d?.season?.year) setYear(d.season.year);
      if (d?.season?.type) setSeasonType(d.season.type);
    })();
  }, []);

  useEffect(() => { getLeagueDefense(defaultYear).then(setLeague); }, [defaultYear]);

  useEffect(() => {
    if (!week) return;
    setLoading(true); setError(null); setSelected(null);
    getSchedule(year, week, seasonType)
      .then((s) => { setSched(s); setLoading(false); })
      .catch((e) => { setError(e.message); setLoading(false); });
  }, [year, week, seasonType]);

  const weeks = seasonType === 2 ? 18 : 5;

  return (
    <div className="field" style={{
      fontFamily: "'Inter',sans-serif", height: "100vh", display: "flex", flexDirection: "column",
    }}>
      {/* header */}
      <div style={{
        padding: "11px 18px", display: "flex", alignItems: "center", gap: 14,
        background: "linear-gradient(180deg, rgba(10,45,26,.95), rgba(10,45,26,.72))",
        borderBottom: `2px solid ${T.chalk}`, flexShrink: 0, flexWrap: "wrap",
        boxShadow: `0 3px 0 ${T.leatherDark}, 0 8px 20px rgba(0,0,0,.4)`, zIndex: 2,
      }}>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 25, fontWeight: 700,
          letterSpacing: 2.5, color: T.gold,
          textShadow: `0 2px 0 ${T.leatherDark}, 0 4px 10px rgba(0,0,0,.55)`,
        }}>🏈 GRIDIRON EDGE</div>
        <div style={{ color: T.inkDim, fontSize: 10, letterSpacing: 1.4, paddingTop: 3 }}>
          NFL MATCHUP ANALYSIS · APOLLO MEDIA
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <select value={seasonType} onChange={(e) => { setSeasonType(+e.target.value); setWeek(1); }}>
            <option value={2}>Regular season</option>
            <option value={3}>Postseason</option>
          </select>
          <select value={week || 1} onChange={(e) => setWeek(+e.target.value)}>
            {Array.from({ length: weeks }, (_, i) => i + 1).map((w) =>
              <option key={w} value={w}>Week {w}</option>)}
          </select>
          <select value={year} onChange={(e) => setYear(+e.target.value)}>
            {[defaultYear, defaultYear - 1, defaultYear - 2].map((y) =>
              <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>

      <div className="gx-shell" style={{ display: "flex", flex: 1, overflow: "hidden" }}>
        {/* sideline */}
        <div className="gx-side" style={{
          width: 224, borderRight: `2px solid ${T.chalkDim}`, overflowY: "auto",
          padding: "10px 0", flexShrink: 0, background: "rgba(0,0,0,.26)",
        }}>
          <div style={{
            padding: "0 12px 8px", fontSize: 9.5, color: T.inkFaint,
            letterSpacing: 1.4, fontWeight: 600,
          }}>{loading ? "LOADING…" : `${sched.games.length} GAMES`}</div>
          {error && <div style={{ padding: "12px", color: T.poor, fontSize: 11 }}>Error: {error}</div>}
          {sched.games.map((g) => {
            const sel = selected?.id === g.id;
            const d = new Date(g.date);
            return (
              <button key={g.id} className="game-btn" onClick={() => setSelected(g)} style={{
                width: "100%", textAlign: "left",
                background: sel ? "rgba(255,199,44,.15)" : "transparent",
                border: `1px solid ${sel ? T.gold : "transparent"}`,
                borderLeft: `3px solid ${sel ? T.gold : "transparent"}`,
                borderRadius: 3, padding: "8px 12px", cursor: "pointer",
                color: T.ink, marginBottom: 1, fontFamily: "'Inter',sans-serif",
              }}>
                <div style={{ fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
                  {g.away.abbr} <span style={{ color: T.inkFaint, fontSize: 10.5, fontWeight: 400 }}>at</span> {g.home.abbr}
                  {g.state === "in" && <span style={{
                    width: 6, height: 6, borderRadius: "50%", background: T.gold, display: "inline-block",
                  }}/>}
                </div>
                <div style={{ fontSize: 10, color: T.inkFaint, marginTop: 2 }}>
                  {d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}
                  {" · "}{d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}
                </div>
              </button>
            );
          })}
          {!loading && sched.byes.length > 0 && (
            <div style={{ padding: "12px", borderTop: `1px solid ${T.chalkFaint}`, marginTop: 8 }}>
              <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: 1, marginBottom: 5 }}>ON BYE</div>
              <div style={{ fontSize: 11, color: T.inkDim, lineHeight: 1.6 }}>{sched.byes.join(" · ")}</div>
            </div>
          )}
        </div>

        <div style={{ flex: 1, overflowY: "auto", padding: 18 }}>
          {!selected && !loading && (
            <div style={{
              display: "flex", flexDirection: "column", alignItems: "center",
              justifyContent: "center", height: "100%", gap: 11, textAlign: "center",
            }}>
              <div style={{ fontSize: 46 }}>🏈</div>
              <div style={{
                fontFamily: "'Barlow Condensed',sans-serif", fontSize: 26, fontWeight: 700,
                letterSpacing: 2.5, color: T.chalk,
                textShadow: `0 2px 0 ${T.leatherDark}`,
              }}>SELECT A GAME</div>
              <div style={{ color: T.inkDim, fontSize: 12, maxWidth: 340, lineHeight: 1.6 }}>
                Season production and a projected line for every skill player and defender,
                adjusted for the defense they're facing.
              </div>
              {!league && <div style={{ color: T.inkFaint, fontSize: 11 }}>Loading league defensive ranks…</div>}
            </div>
          )}
          {selected && <GameView key={selected.id} game={selected} league={league} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
