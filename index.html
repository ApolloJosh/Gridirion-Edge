<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gridiron Edge · NFL Matchup Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{
  --turf:#14512f; --turf-dark:#0e3b22; --turf-deep:#0a2d1a; --turf-light:#1a6139;
  --chalk:#ffffff; --chalk-dim:rgba(255,255,255,.38); --chalk-faint:rgba(255,255,255,.14);
  --gold:#ffc72c; --gold-deep:#e0a413;
  --leather:#6b3410; --leather-dark:#43200a; --leather-mid:#8b4a1c;
  --ink:#f2f7f3; --ink-dim:#b6cdbd; --ink-faint:#7fa38c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{color:var(--ink);font-family:'Inter',sans-serif;overflow:hidden;background:var(--turf-deep);}
.field{
  background-color:var(--turf);
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 2px, rgba(255,255,255,0) 2px 88px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 44px, rgba(0,0,0,0) 44px 88px),
    linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.05) 30%, rgba(0,0,0,.38));
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,.22);}
::-webkit-scrollbar-thumb{background:var(--leather);border-radius:5px;border:2px solid rgba(0,0,0,.2);}
::-webkit-scrollbar-thumb:hover{background:var(--leather-mid);}
.game-btn{transition:background .12s,border-color .12s;}
.game-btn:hover{border-color:var(--gold)!important;background:rgba(255,199,44,.10)!important;}
.card{transition:box-shadow .15s;}
.card:hover{box-shadow:0 3px 0 var(--leather-dark),0 10px 22px rgba(0,0,0,.42);}
.scan-row{transition:background .1s,border-color .1s;cursor:pointer;}
.scan-row:hover{background:rgba(255,199,44,.10)!important;border-color:var(--gold)!important;}
select{background:var(--turf-dark);color:var(--ink);border:1px solid var(--chalk-dim);
  border-radius:3px;padding:5px 9px;font-family:'Inter',sans-serif;font-size:11px;
  font-weight:500;outline:none;cursor:pointer;}
select:hover{border-color:var(--gold);}
.hash{background-image:repeating-linear-gradient(90deg,var(--chalk-faint) 0 10px,transparent 10px 26px);height:2px;width:100%;}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.pulsing{animation:pulse 1.3s ease-in-out infinite;}

/* ---------------------------------------------------------------- *
 * Mobile. Inline styles win over plain rules, so overrides here use
 * !important by necessity rather than by preference.
 * ---------------------------------------------------------------- */

/* iOS: 100vh includes the collapsing address bar, so the bottom of the
   app gets cut off. dvh tracks the visible viewport. */
@supports (height:100dvh){ .gx-app{height:100dvh!important;} }
html,body{max-width:100%;overflow-x:hidden;}
.gx-side,.gx-main{-webkit-overflow-scrolling:touch;}

@media (max-width:860px){
  .gx-shell{flex-direction:column!important;}

  /* The sideline becomes a horizontal strip of game chips. A 184px-tall
     vertical list ate a quarter of a phone screen before anything useful. */
  .gx-side{
    width:100%!important;max-height:none!important;
    display:flex!important;flex-direction:row!important;
    overflow-x:auto!important;overflow-y:hidden!important;
    gap:6px;padding:8px 10px!important;
    border-right:none!important;border-bottom:2px solid var(--chalk-dim)!important;
    scroll-snap-type:x proximity;
  }
  .gx-side > button{
    width:auto!important;flex:0 0 auto!important;min-width:118px;
    margin-bottom:0!important;scroll-snap-align:start;
  }
  /* Bye list and section labels are noise in a horizontal rail. */
  .gx-side > div{display:none!important;}

  .gx-main{padding:13px!important;}
  .gx-header{padding:9px 13px!important;gap:9px!important;}
  .gx-tagline{display:none!important;}
  .gx-controls{width:100%;margin-left:0!important;}
  .gx-controls select{flex:1 1 0;min-height:38px;}

  /* 16px keeps iOS Safari from zooming in when a select is focused. */
  select{font-size:16px!important;}

  /* Tabs scroll sideways instead of wrapping onto three cramped lines. */
  .gx-tabs{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px;}
  .gx-tabs > button{flex:0 0 auto;min-height:40px;}
  .gx-tabs > label{flex:0 0 auto;}

  /* Even columns beat ragged flex-wrap once the row is narrow. */
  .gx-statgrid{
    display:grid!important;
    grid-template-columns:repeat(auto-fill,minmax(74px,1fr))!important;
    gap:12px 10px!important;
  }
}

@media (max-width:560px){
  /* Board rows restack: identity on top, numbers underneath. */
  .scan-row{flex-wrap:wrap!important;padding:11px 12px!important;}
  .gx-row-main{flex:1 1 100%!important;order:1;}
  .gx-row-proj{order:2;text-align:left!important;min-width:0!important;flex:1 1 auto;}
  .gx-row-score{order:3;min-width:0!important;flex:0 0 auto;}
  .gx-statgrid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ==================================================================== *
 * Gridiron Edge — NFL matchup analysis · Apollo Media
 * Data: ESPN public APIs (no key). See docs/api-notes.md.
 *
 * VERIFIED TRAPS — do not "fix" these back:
 *  - team.athletes (?enable=roster) is a FLAT array, not groups with .items
 *  - per-athlete stats are categories[].statistics[], each entry ONE SEASON
 *    whose .stats array is positionally parallel to the category .names
 *  - the BULK byathlete endpoint has a DIFFERENT shape: categories[].values
 *    parallel to a schema in the RESPONSE-level categories[].names
 *  - core "defensive" yardsAllowed / pointsAllowed are 0 for all 32 teams
 *    while returning HTTP 200 — real points allowed comes from standings
 *  - the /teams list endpoint is NOT CORS-open; build the map from standings
 *  - weather has temperature + gust but NO windSpeed field
 *  - Week 1 fallback must test the MEDIAN team's games played, not the sum
 *  - interceptions means THROWN picks in `passing` and CAUGHT picks in
 *    `defensiveinterceptions` — always scope the category before reading it
 * ==================================================================== */

/* Bump on every change. Shown in the header so "am I actually running the new
   file?" is answerable at a glance instead of by guesswork. */
const BUILD = "v4 · 2026-09-11";

const ESPN      = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const ESPN_V2   = "https://site.api.espn.com/apis/v2/sports/football/nfl";
const ESPN_WEB  = "https://site.web.api.espn.com/apis/common/v3/sports/football/nfl";
const ESPN_CORE = "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl";
const BYATHLETE = `${ESPN_WEB}/statistics/byathlete`;

const T = {
  turf: "#14512f", turfDark: "#0e3b22", turfDeep: "#0a2d1a", turfLight: "#1a6139",
  chalk: "#ffffff", chalkDim: "rgba(255,255,255,.38)", chalkFaint: "rgba(255,255,255,.14)",
  gold: "#ffc72c", goldDeep: "#e0a413",
  leather: "#6b3410", leatherDark: "#43200a", leatherMid: "#8b4a1c",
  ink: "#f2f7f3", inkDim: "#b6cdbd", inkFaint: "#7fa38c",
  good: "#b9e6a1", bad: "#ffab91", poor: "#ff6b5e",
};
const SHADOW = `0 2px 0 ${T.leatherDark}, 0 6px 16px rgba(0,0,0,.38)`;
const SHADOW_SM = `0 2px 0 ${T.leatherDark}`;

const DIVISION = {
  BUF:"AFC East", MIA:"AFC East", NE:"AFC East", NYJ:"AFC East",
  BAL:"AFC North", CIN:"AFC North", CLE:"AFC North", PIT:"AFC North",
  HOU:"AFC South", IND:"AFC South", JAX:"AFC South", TEN:"AFC South",
  DEN:"AFC West", KC:"AFC West", LV:"AFC West", LAC:"AFC West",
  DAL:"NFC East", NYG:"NFC East", PHI:"NFC East", WSH:"NFC East",
  CHI:"NFC North", DET:"NFC North", GB:"NFC North", MIN:"NFC North",
  ATL:"NFC South", CAR:"NFC South", NO:"NFC South", TB:"NFC South",
  ARI:"NFC West", LAR:"NFC West", SEA:"NFC West", SF:"NFC West",
};

const OFF_POS = ["QB", "RB", "FB", "WR", "TE"];
const DEF_POS = ["DE", "DT", "NT", "LB", "OLB", "ILB", "MLB", "CB", "S", "FS", "SS", "DB", "EDGE"];

/* ------------------------------ plumbing ------------------------------ */

/**
 * Response cache. It used to be permanent, which quietly broke Rescan: the
 * button re-ran every step but each fetch was served from this map, so nothing
 * could ever change — including a game flipping from "pre" to "post" while the
 * page sat open. Entries now expire, and a forced rescan clears them outright.
 */
const CACHE_TTL_MS = 5 * 60 * 1000;
const _cache = new Map();

function clearCache() { _cache.clear(); }

async function fetchJSON(url) {
  const hit = _cache.get(url);
  if (hit && Date.now() - hit.at < CACHE_TTL_MS) return hit.p;
  const p = (async () => {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })();
  _cache.set(url, { p, at: Date.now() });
  p.catch(() => _cache.delete(url));
  return p;
}
async function safeJSON(url) { try { return await fetchJSON(url); } catch { return null; } }

async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
  }));
  return out;
}

function num(v) {
  if (v === null || v === undefined) return NaN;
  const n = parseFloat(String(v).replace(/,/g, ""));
  return isNaN(n) ? NaN : n;
}
const fmt = (v, d = 1) => (isNaN(num(v)) ? "—" : num(v).toFixed(d));
const int = (v) => (isNaN(num(v)) ? "—" : String(Math.round(num(v))));
function ordinal(n) {
  if (!n || isNaN(n)) return "—";
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* ------------------------------ grading ------------------------------ */

function grade(val, thresholds, higherIsBetter = true) {
  const v = num(val);
  if (isNaN(v)) return null;
  const [elite, good, avg, bad] = thresholds;
  if (higherIsBetter) {
    if (v >= elite) return "elite";
    if (v >= good) return "good";
    if (v >= avg) return "avg";
    if (v >= bad) return "bad";
    return "poor";
  }
  if (v <= elite) return "elite";
  if (v <= good) return "good";
  if (v <= avg) return "avg";
  if (v <= bad) return "bad";
  return "poor";
}
const GRADE_COLOR = { elite: T.gold, good: T.good, avg: T.chalk, bad: T.bad, poor: T.poor };
const gradeColor = (g) => (g ? GRADE_COLOR[g] : T.inkFaint);
const GRADE_SCORE = { elite: 1, good: 0.75, avg: 0.5, bad: 0.25, poor: 0 };

/**
 * Resolve a stat by trying candidate field names across categories, scoped and
 * case-insensitive: the bulk feed spells it `defensiveinterceptions`, the
 * per-athlete feed `defensiveInterceptions`.
 */
function statOf(stats, categories, candidates) {
  if (!stats) return undefined;
  const lower = {};
  Object.keys(stats).forEach((k) => { lower[k.toLowerCase()] = stats[k]; });
  for (const cat of categories) {
    const block = lower[cat.toLowerCase()];
    if (!block) continue;
    for (const key of candidates) {
      if (block[key] !== undefined && block[key] !== null && block[key] !== "") return block[key];
    }
  }
  return undefined;
}
const DEF_CATS = ["defensive", "defensiveinterceptions", "general"];
const defStat = (s, candidates) => statOf(s, DEF_CATS, candidates);

/* --------------------------- schedule --------------------------- */

async function getSchedule(year, week, seasonType) {
  const d = await fetchJSON(`${ESPN}/scoreboard?seasontype=${seasonType}&week=${week}&dates=${year}`);
  const games = (d.events || []).map((ev) => {
    const comp = ev.competitions?.[0] || {};
    const home = (comp.competitors || []).find((c) => c.homeAway === "home") || {};
    const away = (comp.competitors || []).find((c) => c.homeAway === "away") || {};
    const side = (c) => ({
      id: c.team?.id, abbr: c.team?.abbreviation, name: c.team?.displayName,
      logo: c.team?.logo, score: c.score, record: (c.records || [])[0]?.summary,
    });
    return {
      id: ev.id, name: ev.shortName || ev.name, date: ev.date,
      status: comp.status?.type?.description, state: comp.status?.type?.state,
      completed: comp.status?.type?.completed,
      venue: comp.venue?.fullName, indoor: comp.venue?.indoor,
      home: side(home), away: side(away),
    };
  });
  games.sort((a, b) => new Date(a.date) - new Date(b.date));
  return { games, byes: (d.week?.teamsOnBye || []).map((t) => t.abbreviation) };
}

/**
 * Has this game already kicked off? Deliberately belt-and-braces: three
 * independent signals, any one of which is enough. An earlier build trusted
 * `state` alone, and a single missing field would have silently put finished
 * games back on the board — the failure is invisible, so don't rely on one key.
 */
function hasStarted(g) {
  if (!g) return false;
  if (g.state === "post" || g.state === "in") return true;
  if (g.completed === true) return true;
  const t = new Date(g.date).getTime();
  return !isNaN(t) && t <= Date.now();
}

/* --------------------- league defensive context --------------------- */

function walkStandings(node, out = []) {
  if (!node) return out;
  if (node.standings?.entries) out.push(...node.standings.entries);
  (node.children || []).forEach((c) => walkStandings(c, out));
  return out;
}

async function getStandings(year) {
  const d = await safeJSON(`${ESPN_V2}/standings?season=${year}`);
  if (!d) return [];
  return walkStandings(d).map((e) => {
    const s = {};
    (e.stats || []).forEach((x) => { s[x.name] = x.value !== undefined ? x.value : num(x.displayValue); });
    const gp = (s.wins || 0) + (s.losses || 0) + (s.ties || 0);
    return {
      id: e.team?.id, abbr: e.team?.abbreviation, name: e.team?.displayName, gp,
      pointsAgainst: s.pointsAgainst, pointsFor: s.pointsFor,
      record: [s.wins, s.losses].filter((v) => v !== undefined).join("-") + (s.ties ? "-" + s.ties : ""),
    };
  }).filter((t) => t.abbr);
}

async function getTeamDefStats(year, teamId) {
  const d = await safeJSON(`${ESPN_CORE}/seasons/${year}/types/2/teams/${teamId}/statistics`);
  const cat = d?.splits?.categories?.find((c) => c.name === "defensive");
  const g = (n) => {
    const s = (cat?.stats || []).find((x) => x.name === n);
    return s ? num(s.value ?? s.displayValue) : NaN;
  };
  return {
    sacks: g("sacks"), passesDefended: g("passesDefended"),
    stuffs: g("stuffs"), tacklesForLoss: g("tacklesForLoss"), gp: g("teamGamesPlayed"),
  };
}

function rankBy(rows, key, higherIsBetter) {
  const valid = rows.filter((r) => !isNaN(r[key]));
  const sorted = [...valid].sort((a, b) => (higherIsBetter ? b[key] - a[key] : a[key] - b[key]));
  const map = {};
  sorted.forEach((r, i) => { map[r.abbr] = i + 1; });
  return map;
}

/** Week 1 trap: a Thursday opener leaves 2 teams at 1 game and 30 at 0. */
function seasonHasSample(standings) {
  if (!standings.length) return false;
  const gps = standings.map((t) => t.gp || 0).sort((a, b) => a - b);
  return gps[Math.floor(gps.length / 2)] >= 4;
}

async function getLeagueDefense(year) {
  let season = year;
  let standings = await getStandings(season);
  if (!seasonHasSample(standings)) {
    const prior = await getStandings(year - 1);
    if (seasonHasSample(prior)) { season = year - 1; standings = prior; }
  }
  if (!standings.length) return null;

  const stats = await pool(standings, 8, (t) => getTeamDefStats(season, t.id));
  const rows = standings.map((t, i) => {
    const s = stats[i] || {};
    const gp = t.gp || s.gp || 1;
    return {
      abbr: t.abbr, name: t.name, record: t.record, gp,
      papg: t.pointsAgainst ? t.pointsAgainst / gp : NaN,
      ppg: t.pointsFor ? t.pointsFor / gp : NaN,
      sacksPg: isNaN(s.sacks) ? NaN : s.sacks / gp,
      pdPg: isNaN(s.passesDefended) ? NaN : s.passesDefended / gp,
      stuffsPg: isNaN(s.stuffs) ? NaN : s.stuffs / gp,
      tflPg: isNaN(s.tacklesForLoss) ? NaN : s.tacklesForLoss / gp,
    };
  });

  const rPapg = rankBy(rows, "papg", false), rSacks = rankBy(rows, "sacksPg", true),
        rPd = rankBy(rows, "pdPg", true), rStuffs = rankBy(rows, "stuffsPg", true),
        rTfl = rankBy(rows, "tflPg", true), rOff = rankBy(rows, "ppg", true);

  const wc = rows.map((r) => ({
    ...r,
    _pass: ((rSacks[r.abbr] || 16) + (rPd[r.abbr] || 16) + (rPapg[r.abbr] || 16)) / 3,
    _run:  ((rStuffs[r.abbr] || 16) + (rTfl[r.abbr] || 16) + (rPapg[r.abbr] || 16)) / 3,
  }));
  const rPass = rankBy(wc, "_pass", false), rRun = rankBy(wc, "_run", false);

  const table = {};
  wc.forEach((r) => {
    table[r.abbr] = {
      ...r, rankPapg: rPapg[r.abbr], rankSacks: rSacks[r.abbr], rankPd: rPd[r.abbr],
      rankStuffs: rStuffs[r.abbr], rankTfl: rTfl[r.abbr],
      rankPass: rPass[r.abbr], rankRun: rRun[r.abbr], rankOffense: rOff[r.abbr],
    };
  });
  return { season, table, teams: standings.length };
}

/* --------------------------- player sources --------------------------- */

async function getRoster(teamId) {
  const d = await safeJSON(`${ESPN}/teams/${teamId}?enable=roster`);
  const athletes = d?.team?.athletes || [];   // FLAT array
  return athletes.map((a) => ({
    id: a.id, name: a.displayName, jersey: a.jersey,
    pos: a.position?.abbreviation, active: a.active !== false,
  })).filter((a) => a.id && a.pos);
}

/** Per-athlete career feed: categories[].statistics[] = one entry per SEASON. */
async function getAthleteSeason(playerId) {
  const d = await safeJSON(`${ESPN_WEB}/athletes/${playerId}/stats`);
  if (!d?.categories) return null;
  const out = { season: null };
  for (const cat of d.categories) {
    const names = cat.names || [], seasons = cat.statistics || [];
    if (!names.length || !seasons.length) continue;
    let latest = null;
    for (const s of seasons) {
      const y = s?.season?.year;
      if (y != null && (!latest || y > latest.season.year)) latest = s;
    }
    if (!latest) continue;
    const vals = {};
    names.forEach((n, i) => { vals[n] = latest.stats?.[i]; });
    out[cat.name] = vals;
    if (!out.season || latest.season.year > out.season) out.season = latest.season.year;
  }
  return out.season ? out : null;
}

/**
 * BULK feed — the whole league in one request, up to 250 athletes per call.
 * Different shape from the per-athlete feed: each athlete's categories carry a
 * `values` array parallel to a schema held at the RESPONSE level.
 */
async function getBulkAthletes(season, sort, limit) {
  const url = `${BYATHLETE}?region=us&lang=en&contentorigin=espn&isqualified=false`
    + `&season=${season}&seasontype=2&page=1&limit=${limit}&sort=${encodeURIComponent(sort)}`;
  const d = await safeJSON(url);
  if (!d?.athletes) return [];
  const schema = {};
  (d.categories || []).forEach((c) => { schema[c.name] = c.names || []; });
  return d.athletes.map((a) => {
    const stats = { season };
    (a.categories || []).forEach((c) => {
      const names = schema[c.name] || c.names || [];
      const vals = c.values || [];
      const blk = {};
      names.forEach((n, i) => { blk[n] = vals[i]; });
      stats[c.name] = blk;
    });
    return {
      id: a.athlete?.id, name: a.athlete?.displayName, jersey: a.athlete?.jersey,
      pos: a.athlete?.position?.abbreviation, team: a.athlete?.teamShortName, stats,
    };
  }).filter((p) => p.id && p.team && p.pos);
}

/* --------------------------- game detail --------------------------- */

async function getGameDetail(eventId) {
  const d = await safeJSON(`${ESPN}/summary?event=${eventId}`);
  if (!d) return null;
  const w = d.gameInfo?.weather || null;
  const injuries = {};
  (Array.isArray(d.injuries) ? d.injuries : []).forEach((block) => {
    const ab = block.team?.abbreviation;
    if (!ab) return;
    injuries[ab] = (block.injuries || []).map((x) => ({
      name: x.athlete?.displayName, pos: x.athlete?.position?.abbreviation,
      status: x.status, detail: x.details?.type || x.type?.description || "",
    }));
  });
  return {
    weather: w ? { temp: w.temperature ?? w.highTemperature, gust: w.gust, conditionId: w.conditionId } : null,
    indoor: d.gameInfo?.venue?.indoor,
    injuries,
  };
}

/* ====================== PROJECTION ENGINE ====================== */

const MATCHUP_SPREAD = 0.12;
const PACE_SPREAD    = 0.08;

function rankMultiplier(rank, n, spread) {
  if (!rank || !n || n < 2) return 1;
  const mid = (n + 1) / 2;
  return 1 + spread * ((rank - mid) / ((n - 1) / 2));
}

function weatherFactor(wx, indoor, phase) {
  if (indoor) return { key: "wx", label: "Indoor — no weather effect", mult: 1, active: true };
  const temp = num(wx?.temp), gust = num(wx?.gust);
  if (isNaN(temp) && isNaN(gust)) {
    return { key: "wx", label: "Weather unavailable", mult: 1, active: false, pending: true };
  }
  let mult = 1;
  const notes = [];
  if (!isNaN(gust) && gust >= 20) { mult *= phase === "pass" ? 0.92 : 1.04; notes.push(`gusts ${Math.round(gust)}mph`); }
  else if (!isNaN(gust) && gust >= 15) { mult *= phase === "pass" ? 0.96 : 1.02; notes.push(`gusts ${Math.round(gust)}mph`); }
  if (!isNaN(temp) && temp < 25) { mult *= phase === "pass" ? 0.96 : 1.02; notes.push(`${Math.round(temp)}°F`); }
  else if (!isNaN(temp) && temp < 35) { mult *= phase === "pass" ? 0.98 : 1.01; notes.push(`${Math.round(temp)}°F`); }
  return {
    key: "wx",
    label: notes.length ? `Weather: ${notes.join(", ")}` : `Weather neutral${isNaN(temp) ? "" : ` (${Math.round(temp)}°F)`}`,
    mult, active: true,
  };
}

function archetypeOf(pos, per) {
  if (pos === "QB") {
    if (per.rushYdsPg >= 30) return "Dual threat";
    if (per.ypa >= 8.2) return "Downfield passer";
    return "Pocket passer";
  }
  if (pos === "RB" || pos === "FB") {
    if (per.recPg >= 3.5) return "Receiving back";
    if (per.carPg >= 15 && per.ypc < 4.2) return "Bruiser";
    if (per.ypc >= 4.8) return "Explosive back";
    return "Rotational back";
  }
  if (pos === "TE") return per.tgtPg >= 6 ? "Move TE" : "In-line TE";
  if (per.ypr >= 15) return "Deep threat";
  if (per.tgtPg >= 8) return "Volume WR1";
  if (per.ypr > 0 && per.ypr < 11) return "Possession WR";
  return "Rotational WR";
}

function buildFactors({ phase, defRow, defAbbr, teams, wx, indoor, archetype }) {
  const factors = [];
  if (phase === "defense") {
    const rank = defRow?.rankOffense;
    factors.push({
      key: "pace", label: `${defAbbr} offense ${ordinal(rank)} in scoring`,
      mult: rankMultiplier(rank, teams, PACE_SPREAD), active: !!rank, note: "volume proxy",
    });
  } else {
    const rank = phase === "pass" ? defRow?.rankPass : defRow?.rankRun;
    factors.push({
      key: "def",
      label: `${defAbbr} ${phase === "pass" ? "pass" : "run"} defense ${ordinal(rank)} of ${teams}`,
      mult: rankMultiplier(rank, teams, MATCHUP_SPREAD), active: !!rank,
    });
  }
  factors.push(weatherFactor(wx, indoor, phase === "rush" ? "rush" : "pass"));
  factors.push({ key: "time", label: "Kickoff window / game script", mult: 1, active: false, pending: true, note: "not yet modeled" });
  factors.push({ key: "arch", label: `Defense vs ${archetype || "archetype"}`, mult: 1, active: false, pending: true, note: "needs charting data" });
  return factors;
}

const chainMultiplier = (factors) =>
  factors.filter((f) => f.active && !isNaN(f.mult)).reduce((a, f) => a * f.mult, 1);

function edgeScore(playerGrades, defRank, teams = 32) {
  const gs = playerGrades.filter(Boolean).map((g) => GRADE_SCORE[g]);
  if (!gs.length) return null;
  const player = gs.reduce((a, b) => a + b, 0) / gs.length;
  const softness = defRank ? (defRank - 1) / Math.max(1, teams - 1) : 0.5;
  return Math.round((player * 0.6 + softness * 0.4) * 100);
}
function edgeVerdict(score) {
  if (score === null) return { label: "No data", tone: "neutral" };
  if (score >= 72) return { label: "Smash spot", tone: "hot" };
  if (score >= 58) return { label: "Lean", tone: "warm" };
  if (score >= 42) return { label: "Neutral", tone: "neutral" };
  if (score >= 28) return { label: "Soft fade", tone: "cool" };
  return { label: "Fade", tone: "cold" };
}

const KIND_OF_POS = (pos) =>
  pos === "QB" ? "QB"
  : ["WR", "TE"].includes(pos) ? "REC"
  : ["RB", "FB"].includes(pos) ? "RB"
  : DEF_POS.includes(pos) ? "DEF" : null;

/**
 * THE shared analysis. The scanner and the game cards both call this, so a
 * player's EDGE is identical in both views by construction.
 * ctx: { defAbbr, defRow, teams, wx, indoor }
 */
function analyze(p, kind, ctx) {
  const s = p.stats || {};
  const passing = s.passing || {}, rushing = s.rushing || {}, receiving = s.receiving || {};
  const gpAny = num(statOf(s, ["general", "passing", "rushing", "receiving", "defensive"], ["gamesPlayed", "teamGamesPlayed"]));
  const G = gpAny && gpAny > 0 ? gpAny : NaN;

  let per = {}, seasonCells = [], baseline = {}, projLabels = [], grades = [], phase = "pass", volume = 0;

  if (kind === "QB") {
    phase = "pass";
    const att = num(passing.passingAttempts), yds = num(passing.passingYards),
          td = num(passing.passingTouchdowns), ints = num(passing.interceptions),
          rtg = num(passing.QBRating), ypa = num(passing.yardsPerPassAttempt),
          cmp = num(passing.completionPct), rush = num(rushing.rushingYards);
    volume = att;
    per = { ypg: yds / G, tdPg: td / G, ypa, rushYdsPg: rush / G };
    const tdPct = att ? (td / att) * 100 : NaN, intPct = att ? (ints / att) * 100 : NaN;
    const g1 = grade(yds / G, [285, 250, 215, 180]), g2 = grade(rtg, [100, 90, 80, 70]),
          g3 = grade(ypa, [8.2, 7.4, 6.7, 6.0]), g4 = grade(cmp, [68, 64, 60, 56]),
          g5 = grade(tdPct, [6, 4.8, 3.8, 2.8]), g6 = grade(intPct, [1.4, 2, 2.6, 3.2], false);
    grades = [g1, g2, g3, g4, g5, g6];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 },
      { label: "RTG", value: fmt(rtg), g: g2 },
      { label: "YPA", value: fmt(ypa), g: g3 },
      { label: "CMP%", value: isNaN(cmp) ? "—" : fmt(cmp) + "%", g: g4 },
      { label: "TD%", value: isNaN(tdPct) ? "—" : tdPct.toFixed(1) + "%", g: g5 },
      { label: "INT%", value: isNaN(intPct) ? "—" : intPct.toFixed(1) + "%", g: g6 },
      { label: "TD/G", value: fmt(td / G) },
      { label: "RUSH/G", value: fmt(rush / G) },
    ];
    baseline = { passYds: yds / G, passTd: td / G, ints: ints / G, rushYds: rush / G };
    projLabels = [
      { key: "passYds", label: "PASS YDS", d: 1, headline: true },
      { key: "passTd", label: "PASS TD", d: 2 },
      { key: "ints", label: "INT", d: 2 },
      { key: "rushYds", label: "RUSH YDS", d: 1 },
    ];
  } else if (kind === "REC") {
    phase = "pass";
    const rec = num(receiving.receptions), yds = num(receiving.receivingYards),
          tgt = num(receiving.receivingTargets), td = num(receiving.receivingTouchdowns),
          ypr = num(receiving.yardsPerReception);
    volume = tgt;
    per = { ypr, tgtPg: tgt / G, recPg: rec / G };
    const g1 = grade(yds / G, [80, 60, 42, 28]), g2 = grade(tgt / G, [8.5, 6.5, 4.5, 3]),
          g3 = grade(ypr, [15, 12.5, 10.5, 8.5]), g4 = grade(rec / G, [6, 4.5, 3, 2]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 },
      { label: "TGT/G", value: fmt(tgt / G), g: g2 },
      { label: "REC/G", value: fmt(rec / G), g: g4 },
      { label: "YPR", value: fmt(ypr), g: g3 },
      { label: "TD", value: int(td) },
      { label: "YDS", value: int(yds), sub: isNaN(G) ? "" : `${int(G)}g` },
    ];
    baseline = { recYds: yds / G, rec: rec / G, tgt: tgt / G, td: td / G };
    projLabels = [
      { key: "recYds", label: "REC YDS", d: 1, headline: true },
      { key: "rec", label: "REC", d: 1 },
      { key: "tgt", label: "TGT", d: 1 },
      { key: "td", label: "TD", d: 2 },
    ];
  } else if (kind === "RB") {
    phase = "rush";
    const car = num(rushing.rushingAttempts), yds = num(rushing.rushingYards),
          ypc = num(rushing.yardsPerRushAttempt), td = num(rushing.rushingTouchdowns),
          rec = num(receiving.receptions), recYds = num(receiving.receivingYards);
    volume = car;
    per = { carPg: car / G, ypc, recPg: rec / G };
    const g1 = grade(yds / G, [90, 70, 50, 32]), g2 = grade(car / G, [18, 14, 10, 6]),
          g3 = grade(ypc, [5, 4.5, 4.1, 3.7]), g4 = grade(rec / G, [4, 2.5, 1.5, .8]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 },
      { label: "CAR/G", value: fmt(car / G), g: g2 },
      { label: "YPC", value: fmt(ypc), g: g3 },
      { label: "REC/G", value: fmt(rec / G), g: g4 },
      { label: "TD", value: int(td) },
      { label: "YDS", value: int(yds), sub: isNaN(G) ? "" : `${int(G)}g` },
    ];
    baseline = { rushYds: yds / G, car: car / G, td: td / G, recYds: recYds / G };
    projLabels = [
      { key: "rushYds", label: "RUSH YDS", d: 1, headline: true },
      { key: "car", label: "CAR", d: 1 },
      { key: "td", label: "RUSH TD", d: 2 },
      { key: "recYds", label: "REC YDS", d: 1 },
    ];
  } else {
    phase = "defense";
    const tkl = num(defStat(s, ["totalTackles", "tackles", "combinedTackles"])),
          sacks = num(defStat(s, ["sacks", "totalSacks"])),
          ints = num(defStat(s, ["interceptions", "totalInterceptions"])),
          pd = num(defStat(s, ["passesDefended", "passesBattedDown"])),
          tfl = num(defStat(s, ["tacklesForLoss", "totalTacklesForLoss"])),
          ff = num(defStat(s, ["fumblesForced", "defensiveFumblesForced"]));
    volume = tkl;
    const g1 = grade(tkl / G, [7, 5.5, 4, 2.5]), g2 = grade(sacks / G, [.7, .45, .25, .1]),
          g3 = grade(ints / G, [.3, .18, .09, .03]), g4 = grade(pd / G, [1, .6, .35, .15]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "TKL/G", value: fmt(tkl / G), g: g1 },
      { label: "SACK/G", value: fmt(sacks / G, 2), g: g2 },
      { label: "INT/G", value: fmt(ints / G, 2), g: g3 },
      { label: "PD/G", value: fmt(pd / G, 2), g: g4 },
      { label: "TKL", value: int(tkl), sub: isNaN(G) ? "" : `${int(G)}g` },
      { label: "SACKS", value: fmt(sacks, 1) },
      { label: "INT", value: int(ints) },
      { label: "TFL", value: int(tfl) },
      { label: "FF", value: int(ff) },
    ];
    baseline = { tkl: tkl / G, sacks: sacks / G, ints: ints / G, pd: pd / G };
    projLabels = [
      { key: "tkl", label: "TACKLES", d: 1, headline: true },
      { key: "sacks", label: "SACKS", d: 2 },
      { key: "ints", label: "INT", d: 2 },
      { key: "pd", label: "PD", d: 2 },
    ];
  }

  const archetype = kind === "DEF" ? null : archetypeOf(p.pos, per);
  const factors = buildFactors({ ...ctx, phase, archetype });
  const mult = chainMultiplier(factors);
  const projected = { _mult: mult };
  Object.entries(baseline).forEach(([k, v]) => { projected[k] = isNaN(v) ? NaN : v * mult; });

  const defRank = kind === "DEF" ? ctx.defRow?.rankOffense
    : phase === "rush" ? ctx.defRow?.rankRun : ctx.defRow?.rankPass;
  const score = edgeScore(grades, defRank, ctx.teams);

  return {
    kind, phase, archetype, factors, projected, baseline, seasonCells, projLabels,
    grades, score, verdict: edgeVerdict(score), gamesPlayed: G, volume,
    deltaPct: (mult - 1) * 100,
    headline: projLabels.find((l) => l.headline),
  };
}

/* ============================ THE SCANNER ============================ */
/* Five bulk requests cover the whole league. Doing this by roster would be
   ~2,000 athlete calls; byathlete returns 250 players per request. */

const SCAN_PULLS = [
  { sort: "passing.passingYards:desc",    limit: 60  },
  { sort: "receiving.receivingYards:desc", limit: 250 },
  { sort: "rushing.rushingYards:desc",    limit: 150 },
  { sort: "defensive.totalTackles:desc",  limit: 250 },
  { sort: "defensive.sacks:desc",         limit: 120 },
];

/** Minimum season volume to qualify — keeps one-game wonders out of the board. */
const MIN_VOLUME = { QB: 150, REC: 40, RB: 60, DEF: 30 };
const MIN_GAMES = 6;

async function runScan({ year, week, seasonType, league, onProgress }) {
  onProgress?.("Loading this week's slate…");
  const { games, byes } = await getSchedule(year, week, seasonType);
  if (!games.length) return { rows: [], games, byes, empty: true };

  const opponent = {};
  games.forEach((g) => {
    opponent[g.home.abbr] = { game: g, opp: g.away.abbr, home: true };
    opponent[g.away.abbr] = { game: g, opp: g.home.abbr, home: false };
  });

  onProgress?.("Pulling league-wide season stats…");
  const pulls = await pool(SCAN_PULLS, 5, (p) => getBulkAthletes(league.season, p.sort, p.limit));

  /* The bulk feed reports the team a player suited up for IN THAT SEASON. When
     stats fall back a year (or anyone changed teams in the offseason) that is
     the wrong game to file him under, so current rosters override it. */
  onProgress?.("Reconciling offseason moves…");
  const teamIds = [];
  games.forEach((g) => { teamIds.push(g.home, g.away); });
  const rosters = await pool(teamIds, 8, (t) => getRoster(t.id));
  const currentTeam = {};
  teamIds.forEach((t, i) => {
    (rosters[i] || []).forEach((a) => { currentTeam[a.id] = t.abbr; });
  });

  // Merge and de-duplicate: a player can appear in several sorted pulls.
  const byId = new Map();
  pulls.flat().forEach((p) => { if (!byId.has(p.id)) byId.set(p.id, p); });
  const players = [...byId.values()]
    .map((p) => {
      const team = currentTeam[p.id] || p.team;
      return { ...p, team, moved: currentTeam[p.id] && currentTeam[p.id] !== p.team ? p.team : null };
    })
    .filter((p) => opponent[p.team]);

  onProgress?.("Reading game conditions…");
  const details = await pool(games, 8, (g) => getGameDetail(g.id));
  const detailByGame = {};
  games.forEach((g, i) => { detailByGame[g.id] = details[i]; });

  onProgress?.(`Scoring ${players.length} players…`);
  const rows = [];
  for (const p of players) {
    const kind = KIND_OF_POS(p.pos);
    if (!kind) continue;
    const meta = opponent[p.team];
    const detail = detailByGame[meta.game.id];
    const defAbbr = kind === "DEF" ? p.team === meta.game.home.abbr ? meta.game.home.abbr : meta.game.away.abbr : meta.opp;

    /* For a defender, the "opponent" whose offense drives his volume is the
       other team; for a skill player it's the defense he faces. Either way the
       row we look up is the OPPOSING team's. */
    const ctx = {
      defAbbr: meta.opp,
      defRow: league.table[meta.opp],
      teams: league.teams,
      wx: detail?.weather,
      indoor: meta.game.indoor || detail?.indoor,
    };
    const a = analyze(p, kind, ctx);
    if (a.score === null) continue;
    if (!(a.gamesPlayed >= MIN_GAMES)) continue;
    if (!(a.volume >= (MIN_VOLUME[kind] || 0))) continue;

    rows.push({
      player: p, kind, pos: p.pos, team: p.team, opp: meta.opp, home: meta.home,
      moved: p.moved, game: meta.game, analysis: a, score: a.score,
      state: meta.game.state || "pre",
      started: hasStarted(meta.game),
      /* LEAKAGE GUARD: if the stat sample is from the same season as a game
         that has already been played, the projection is partly built from the
         result it claims to predict. Flag it; never present it as clean. */
      leakage: league.season === year && hasStarted(meta.game),
    });
  }

  rows.sort((a, b) => b.score - a.score);
  const started = games.filter(hasStarted);
  const played = started.filter((g) => g.state === "post" || g.completed).length;
  const live = started.length - played;
  return {
    rows, games, byes, season: league.season, played, live,
    statYear: league.season, scanYear: year, scannedAt: Date.now(),
  };
}

const TONES = {

  warm:    { bg: "rgba(185,230,161,.13)", bd: "rgba(185,230,161,.4)",  fg: T.good },
  neutral: { bg: "rgba(255,255,255,.07)", bd: T.chalkFaint,            fg: T.inkDim },
  cool:    { bg: "rgba(255,171,145,.13)", bd: "rgba(255,171,145,.4)",  fg: T.bad },
  cold:    { bg: "rgba(255,107,94,.15)",  bd: "rgba(255,107,94,.5)",   fg: T.poor },
  leather: { bg: "rgba(107,52,16,.42)",   bd: "rgba(139,74,28,.7)",    fg: "#f0c9a8" },
};

function Badge({ label, tone = "neutral", icon }) {
  const t = TONES[tone] || TONES.neutral;

    <span style={{
      display: "inline-flex", alignItems: "center", gap: 5, background: t.bg,

const ChalkLine = ({ opacity = 1, style }) => (

function Panel({ children, style, className = "", onClick }) {

}

function SectionTitle({ children, right }) {

function Stat({ label, value, g, sub }) {

function ProjStat({ label, value, delta }) {

function FactorChain({ factors }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 9 }}>
      {factors.map((f) => {
        const pending = f.pending || !f.active;
        const pct = f.active && !isNaN(f.mult) ? (f.mult - 1) * 100 : null;
        return (
          <span key={f.key} title={f.note || ""} style={{
            display: "inline-flex", alignItems: "center", gap: 6,

            borderRadius: 3, padding: "3px 8px", fontSize: 10,

              fontFamily: "'Barlow Condensed',sans-serif", fontSize: 13, letterSpacing: .4,
              color: pending ? T.inkFaint : pct > 0 ? T.gold : pct < 0 ? T.bad : T.chalk,
            }}>{pending ? (f.note || "pending") : `×${f.mult.toFixed(3)}`}</strong>
          </span>
        );
      })}
    </div>
  );
}

  return (
    <Panel style={{ marginBottom: 10, overflow: "hidden" }}>

              SEASON — WHAT HE'S ACTUALLY DONE

          <div style={{
            padding: "11px 13px 13px",
            background: "linear-gradient(180deg, rgba(107,52,16,.30), rgba(67,32,10,.42))",
            borderTop: `1px solid ${T.chalkFaint}`,
          }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
              <span style={{ fontSize: 9, letterSpacing: 1.4, color: "#e8c9ac", fontWeight: 600 }}>
                PROJECTED LINE vs {ctx.defAbbr}
              </span>
              <span style={{ fontSize: 9, color: "#c9a583" }}>
                season baseline × {a.projected._mult.toFixed(3)}
              </span>
            </div>
            <div className="gx-statgrid" style={{ display: "flex", gap: 22, flexWrap: "wrap" }}>
              {a.projLabels.map((l) => (
                <ProjStat key={l.key} label={l.label}
                  value={isNaN(a.projected[l.key]) ? "—" : a.projected[l.key].toFixed(l.d)}
                  delta={isNaN(a.projected[l.key]) ? undefined : a.deltaPct} />
              ))}
            </div>
            <FactorChain factors={a.factors} />
          </div>
        </>
      )}
    </Panel>
  );
}

/* --------------------------- scanner board --------------------------- */

const SCAN_TABS = [
  { key: "QB",  label: "QB",  match: (r) => r.pos === "QB" },
  { key: "RB",  label: "RB",  match: (r) => ["RB", "FB"].includes(r.pos) },
  { key: "WR",  label: "WR",  match: (r) => r.pos === "WR" },
  { key: "TE",  label: "TE",  match: (r) => r.pos === "TE" },
  { key: "DEF", label: "DEF", match: (r) => r.kind === "DEF" },
];

function ScanRow({ rank, row, onOpen }) {
  const a = row.analysis;
  const head = a.headline;
  const headVal = head && !isNaN(a.projected[head.key]) ? a.projected[head.key].toFixed(head.d) : "—";
  const defFactor = a.factors.find((f) => f.key === "def" || f.key === "pace");
  const wxFactor = a.factors.find((f) => f.key === "wx");

  return (
    <div className="scan-row" onClick={() => onOpen(row.game)} style={{
      display: "flex", alignItems: "center", gap: 12, padding: "9px 12px",
      borderBottom: `1px solid ${T.chalkFaint}`, borderLeft: "3px solid transparent",
    }}>
      <span style={{
        fontFamily: "'Barlow Condensed',sans-serif", fontSize: 17, fontWeight: 700,
        color: rank <= 3 ? T.gold : T.inkFaint, minWidth: 22, textAlign: "right",
      }}>{rank}</span>

      <div className="gx-row-main" style={{ minWidth: 0, flex: "1 1 190px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
          <span style={{ fontWeight: 600, fontSize: 13, color: T.chalk }}>{row.player.name}</span>
          <span style={{ fontSize: 10, color: T.inkFaint }}>
            {row.pos} · {row.team} {row.home ? "vs" : "@"} {row.opp}
          </span>
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 4, flexWrap: "wrap" }}>
          {row.started && row.state !== "in" && <Badge label="FINAL — not bettable" tone="cold" icon="🔒" />}
          {row.state === "in" && <Badge label="IN PROGRESS" tone="cool" icon="●" />}
          {row.leakage && <Badge label="result is in the stat sample" tone="cold" icon="⚠" />}
          {a.archetype && <Badge label={a.archetype} tone="leather" />}
          {row.moved && <Badge label={`stats w/ ${row.moved}`} tone="cool" icon="⇄" />}
          {defFactor && <Badge label={defFactor.label} tone={defFactor.mult > 1.02 ? "warm" : defFactor.mult < 0.98 ? "cool" : "neutral"} />}
          {wxFactor?.active && wxFactor.mult !== 1 && <Badge label={wxFactor.label} tone="cold" />}
        </div>
      </div>

      <div className="gx-row-proj" style={{ textAlign: "right", minWidth: 88 }}>
        <div style={{ fontSize: 9, color: "#e8c9ac", letterSpacing: .5 }}>{head?.label || "PROJ"}</div>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 21, fontWeight: 700, color: T.gold,
        }}>{headVal}</div>
      </div>

      <div className="gx-row-score" style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 130, justifyContent: "flex-end" }}>
        <span style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 25, fontWeight: 700,
          color: TONES[a.verdict.tone].fg, lineHeight: 1,
        }}>{a.score}</span>
        <Badge label={a.verdict.label} tone={a.verdict.tone} />
      </div>
    </div>
  );
}

function Scanner({ scan, scanning, progress, league, week, onOpen, onRescan }) {
  const [tab, setTab] = useState("QB");
  const [includePlayed, setIncludePlayed] = useState(false);
  const allRows = scan?.rows || [];
  const active = SCAN_TABS.find((t) => t.key === tab);

  /* Default to games that haven't kicked off. A finished game can't be bet, and
     its players would otherwise sit on the board all week crowding out the
     matchups still ahead of you. */
  const rows = useMemo(
    () => (includePlayed ? allRows : allRows.filter((r) => !r.started)),
    [allRows, includePlayed]
  );
  const top = useMemo(() => rows.filter(active.match).slice(0, 10), [rows, tab]);
  const counts = useMemo(() => {
    const c = {};
    SCAN_TABS.forEach((t) => { c[t.key] = rows.filter(t.match).length; });
    return c;
  }, [rows]);
  const hiddenCount = allRows.length - rows.length;

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ flexShrink: 0, marginBottom: 14 }}>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 32, fontWeight: 700,
          letterSpacing: 1.5, lineHeight: 1.05, color: T.chalk,
          textShadow: `0 2px 0 ${T.leatherDark}, 0 4px 12px rgba(0,0,0,.5)`,
        }}>
          WEEK {week} <span style={{ color: T.gold }}>EDGE BOARD</span>
        </div>
        <div style={{ fontSize: 11.5, color: T.inkDim, marginTop: 3 }}>
          Top 10 rated edges at each position
          {scan?.games ? ` · ${scan.games.length} games` : ""}
          {league?.season ? ` · ${league.season} stats` : ""}
          {scan && scan.statYear !== scan.scanYear && (
            <span style={{ color: T.gold }}> (prior season — {scan.scanYear} has no usable sample yet)</span>
          )}
        </div>

        {/* Played-games notice: the distortion Josh spotted, made explicit. */}
        {scan && (scan.played > 0 || scan.live > 0) && (
          <div style={{
            marginTop: 9, padding: "8px 11px", borderRadius: 4, fontSize: 11,
            background: "rgba(107,52,16,.34)", border: `1px solid rgba(139,74,28,.7)`,
            color: "#f0c9a8", lineHeight: 1.55,
          }}>
            {scan.played > 0 && <><strong>{scan.played} game{scan.played > 1 ? "s" : ""} already final</strong></>}
            {scan.played > 0 && scan.live > 0 && " · "}
            {scan.live > 0 && <><strong>{scan.live} in progress</strong></>}
            {" — "}
            {includePlayed
              ? "shown below and marked. Those matchups can't be bet."
              : `hidden from the board (${hiddenCount} player${hiddenCount === 1 ? "" : "s"} excluded).`}
          </div>
        )}
      </div>

      {/* position tabs */}
      <div className="gx-tabs" style={{ display: "flex", gap: 7, marginBottom: 14, flexShrink: 0, flexWrap: "wrap" }}>
        {SCAN_TABS.map((t) => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{
            padding: "7px 16px", fontSize: 13, fontWeight: 700, borderRadius: 3, cursor: "pointer",
            background: tab === t.key ? T.gold : "rgba(0,0,0,.3)",
            color: tab === t.key ? T.leatherDark : T.ink,
            border: `1px solid ${tab === t.key ? T.gold : T.chalkDim}`,
            fontFamily: "'Barlow Condensed',sans-serif", letterSpacing: 1,
            boxShadow: tab === t.key ? SHADOW_SM : "none",
          }}>
            {t.label}
            <span style={{ opacity: .65, fontSize: 10, marginLeft: 6 }}>{counts[t.key] || 0}</span>
          </button>
        ))}
        <label style={{
          marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 6,
          fontSize: 11, color: T.inkDim, cursor: "pointer", userSelect: "none",
        }}>
          <input type="checkbox" checked={includePlayed}
            onChange={(e) => setIncludePlayed(e.target.checked)}
            style={{ accentColor: T.gold, cursor: "pointer" }} />
          Include played games
        </label>
        <button onClick={onRescan} disabled={scanning} style={{
          padding: "7px 14px", fontSize: 11, fontWeight: 600, borderRadius: 3,
          cursor: scanning ? "default" : "pointer", background: "rgba(0,0,0,.3)",
          color: scanning ? T.inkFaint : T.ink, border: `1px solid ${T.chalkDim}`,
        }}>{scanning ? "Scanning…" : "↻ Rescan"}</button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingRight: 5 }}>
        {scanning && (
          <Panel style={{ padding: "30px 20px", textAlign: "center" }}>
            <div className="pulsing" style={{
              fontFamily: "'Barlow Condensed',sans-serif", fontSize: 18,
              letterSpacing: 2.5, color: T.gold,
            }}>SCANNING THE SLATE…</div>
            <div style={{ fontSize: 11, color: T.inkDim, marginTop: 8 }}>{progress}</div>
          </Panel>
        )}

        {!scanning && scan?.empty && (
          <Panel style={{ padding: "22px 18px", fontSize: 12, color: T.inkDim }}>
            No games scheduled for this week.
          </Panel>
        )}

        {!scanning && !scan?.empty && top.length === 0 && (
          <Panel style={{ padding: "22px 18px", fontSize: 12, color: T.inkDim }}>
            No qualifying {active.label} met the minimum volume threshold for this slate.
          </Panel>
        )}

        {!scanning && top.length > 0 && (
          <Panel style={{ overflow: "hidden" }}>
            <div style={{
              display: "flex", alignItems: "center", gap: 8, padding: "8px 12px",
              background: "rgba(0,0,0,.25)", fontSize: 9, letterSpacing: 1.3,
              color: T.inkFaint, fontWeight: 600,
            }}>
              TOP 10 {active.label} EDGES · CLICK A ROW FOR THE FULL MATCHUP
            </div>
            <ChalkLine />
            {top.map((row, i) => (
              <ScanRow key={row.player.id} rank={i + 1} row={row} onOpen={onOpen} />
            ))}
          </Panel>
        )}

        {!scanning && scan?.byes?.length > 0 && (
          <div style={{ fontSize: 10, color: T.inkFaint, marginTop: 12 }}>
            On bye (excluded): {scan.byes.join(" · ")}
          </div>
        )}
        {!scanning && top.length > 0 && (
          <div style={{ fontSize: 10, color: T.inkFaint, lineHeight: 1.6, padding: "12px 0 22px" }}>
            EDGE = 60% season production grade + 40% opponent softness by league rank.
            Qualifiers need {MIN_GAMES}+ games and meaningful volume. Projected figures are a
            per-game baseline times the factor chain — open a matchup to audit every multiplier.
          </div>
        )}
      </div>
    </div>
  );
}

/* --------------------------- defense summary --------------------------- */

function DefenseCard({ def, defAbbr, season }) {
  if (!def) return null;
  const item = (label, rank, val) => (
    <div style={{ minWidth: 96 }}>
      <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: .5, marginBottom: 3 }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
        <span style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 21, fontWeight: 700,
          color: rank <= 10 ? T.poor : rank >= 23 ? T.gold : T.chalk,
        }}>{ordinal(rank)}</span>
        <span style={{ fontSize: 10, color: T.inkFaint }}>{val}</span>
      </div>
    </div>
  );
  return (
    <Panel style={{ padding: "12px 14px", marginBottom: 14 }}>
      <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: .8, marginBottom: 10 }}>
        {defAbbr} DEFENSE · {season} RANKS (1 = toughest, 32 = softest)
      </div>
      <div style={{ display: "flex", gap: 22, flexWrap: "wrap" }}>
        {item("PTS ALLOWED", def.rankPapg, isNaN(def.papg) ? "—" : def.papg.toFixed(1) + "/g")}
        {item("PASS D", def.rankPass, isNaN(def.sacksPg) ? "—" : def.sacksPg.toFixed(1) + " sk/g")}
        {item("RUN D", def.rankRun, isNaN(def.stuffsPg) ? "—" : def.stuffsPg.toFixed(1) + " stf/g")}
        {item("COVERAGE", def.rankPd, isNaN(def.pdPg) ? "—" : def.pdPg.toFixed(1) + " pd/g")}
        {item("PRESSURE", def.rankSacks, isNaN(def.tflPg) ? "—" : def.tflPg.toFixed(1) + " tfl/g")}
      </div>
      <div style={{ fontSize: 9, color: T.inkFaint, marginTop: 10, lineHeight: 1.5 }}>
        Points allowed is total defense, not split pass/rush. Pass D and Run D are composites of
        sack, coverage and run-stuff rates — directional, not DVOA.
      </div>
    </Panel>
  );
}

/* ------------------------------ game view ------------------------------ */

function GameView({ game, league, onBack }) {
  const [side, setSide] = useState("home");
  const [detail, setDetail] = useState(null);
  const [groups, setGroups] = useState({ QB: [], REC: [], RB: [], DEF: [] });
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const reqId = useRef(0);

  const off = side === "home" ? game.home : game.away;
  const def = side === "home" ? game.away : game.home;
  const defRow = league?.table?.[def.abbr];
  const teams = league?.teams || 32;

  useEffect(() => { getGameDetail(game.id).then(setDetail); }, [game.id]);

  useEffect(() => {
    const my = ++reqId.current;
    setLoading(true); setErr(null); setGroups({ QB: [], REC: [], RB: [], DEF: [] });
    (async () => {
      try {
        const [offRoster, defRoster] = await Promise.all([getRoster(off.id), getRoster(def.id)]);
        if (!offRoster.length) throw new Error("roster unavailable");
        const offWant = offRoster.filter((p) => OFF_POS.includes(p.pos));
        const defWant = defRoster.filter((p) => DEF_POS.includes(p.pos));
        const all = [...offWant, ...defWant];
        const stats = await pool(all, 8, (p) => getAthleteSeason(p.id));
        if (my !== reqId.current) return;

        const offInj = detail?.injuries?.[off.abbr] || [];
        const defInj = detail?.injuries?.[def.abbr] || [];
        const decorate = (p, i, inj) => ({
          ...p, stats: stats[i], injury: inj.find((x) => x.name === p.name) || null,
        });
        const offPlayers = offWant.map((p, i) => decorate(p, i, offInj)).filter((p) => p.stats);
        const defPlayers = defWant.map((p, i) => decorate(p, offWant.length + i, defInj)).filter((p) => p.stats);

        const v = (p, cat, key) => num(p.stats?.[cat]?.[key]) || 0;
        const dv = (p) => num(defStat(p.stats, ["totalTackles", "tackles", "combinedTackles"])) || 0;

        setGroups({
          QB: offPlayers.filter((p) => p.pos === "QB")
            .sort((a, b) => v(b, "passing", "passingAttempts") - v(a, "passing", "passingAttempts")).slice(0, 2),
          REC: offPlayers.filter((p) => ["WR", "TE"].includes(p.pos))
            .sort((a, b) => v(b, "receiving", "receivingYards") - v(a, "receiving", "receivingYards")).slice(0, 5),
          RB: offPlayers.filter((p) => ["RB", "FB"].includes(p.pos))
            .sort((a, b) => v(b, "rushing", "rushingAttempts") - v(a, "rushing", "rushingAttempts")).slice(0, 3),
          DEF: defPlayers.sort((a, b) => dv(b) - dv(a)).slice(0, 6),
        });
        setLoading(false);
      } catch (e) {
        if (my !== reqId.current) return;
        setErr(e.message); setLoading(false);
      }
    })();
  }, [game.id, side, off.id, def.id, detail]);

  const when = useMemo(() => {
    const d = new Date(game.date);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })
      + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }, [game.date]);

  const wx = detail?.weather;
  const indoor = game.indoor || detail?.indoor;
  const temp = num(wx?.temp), gust = num(wx?.gust);
  const divisional = DIVISION[game.home.abbr] && DIVISION[game.home.abbr] === DIVISION[game.away.abbr];
  const offInjuries = detail?.injuries?.[off.abbr] || [];
  const ctx = { defAbbr: def.abbr, defRow, teams, wx, indoor };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ flexShrink: 0, marginBottom: 13 }}>
        <button onClick={onBack} style={{
          background: "none", border: "none", color: T.gold, fontSize: 11,
          cursor: "pointer", padding: 0, marginBottom: 6, fontFamily: "'Inter',sans-serif",
        }}>← Back to Edge Board</button>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 34, fontWeight: 700,
          letterSpacing: 1.5, lineHeight: 1.05, color: T.chalk,
          textShadow: `0 2px 0 ${T.leatherDark}, 0 4px 12px rgba(0,0,0,.5)`,
        }}>
          {game.away.abbr} <span style={{ color: T.gold, fontSize: 21, fontWeight: 400 }}>at</span> {game.home.abbr}
        </div>
        <div style={{ fontSize: 11.5, color: T.inkDim, marginTop: 3 }}>
          {when} · {game.venue || "TBD"}
          {game.away.record && ` · ${game.away.abbr} ${game.away.record}, ${game.home.abbr} ${game.home.record || ""}`}
        </div>
        <div style={{ display: "flex", gap: 7, marginTop: 9, flexWrap: "wrap" }}>
          {!indoor && !isNaN(gust) && gust >= 15 &&
            <Badge icon="💨" label={`Gusts ${Math.round(gust)} mph — passing suppressed`} tone="cold" />}
          {!indoor && !isNaN(temp) && temp < 35 && <Badge icon="🧊" label={`${Math.round(temp)}°F`} tone="cold" />}
          {!indoor && !isNaN(temp) && temp >= 35 && (isNaN(gust) || gust < 15) &&
            <Badge icon="🌤" label={`${Math.round(temp)}°F${isNaN(gust) ? "" : `, gusts ${Math.round(gust)}`}`} />}
          {indoor && <Badge icon="🏟" label="Indoor — no weather factor" />}
          {divisional && <Badge icon="⚔" label={`Divisional (${DIVISION[game.home.abbr]}) — trends under`} tone="leather" />}
          {game.state && game.state !== "pre" && <Badge label={game.status} />}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexShrink: 0, flexWrap: "wrap" }}>
        {[["away", game.away, game.home], ["home", game.home, game.away]].map(([s, o, d]) => (
          <button key={s} onClick={() => setSide(s)} style={{
            padding: "8px 15px", fontSize: 12.5, fontWeight: 700, borderRadius: 3, cursor: "pointer",
            background: side === s ? T.gold : "rgba(0,0,0,.3)",
            color: side === s ? T.leatherDark : T.ink,
            border: `1px solid ${side === s ? T.gold : T.chalkDim}`,
            fontFamily: "'Barlow Condensed',sans-serif", letterSpacing: .8,
            boxShadow: side === s ? SHADOW_SM : "none",
          }}>
            {o.name} <span style={{ opacity: .7, fontSize: 10 }}>offense vs {d.abbr} D</span>
          </button>
        ))}
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingRight: 5 }}>
        <DefenseCard def={defRow} defAbbr={def.abbr} season={league?.season} />

        {offInjuries.length > 0 && (
          <Panel style={{ padding: "11px 14px", marginBottom: 14 }}>
            <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: .8, marginBottom: 8 }}>
              {off.abbr} INJURY REPORT
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {offInjuries.slice(0, 12).map((x, i) => (
                <Badge key={i} tone={/out|doubtful/i.test(x.status) ? "cold" : "neutral"}
                  label={`${x.name}${x.pos ? ` (${x.pos})` : ""} — ${x.status}`} />
              ))}
            </div>
          </Panel>
        )}

        {err && <div style={{ color: T.poor, fontSize: 12, padding: "10px 0" }}>Could not load: {err}</div>}
        {loading && (
          <div className="pulsing" style={{
            textAlign: "center", padding: 40, color: T.inkDim,
            fontFamily: "'Barlow Condensed',sans-serif", fontSize: 17, letterSpacing: 2.5,
          }}>LOADING ROSTERS & SEASON STATS…</div>
        )}

        {!loading && (
          <>
            <SectionTitle right={`vs ${def.abbr} pass D · ${ordinal(defRow?.rankPass)}`}>🎯 Quarterback</SectionTitle>
            {groups.QB.map((p) => <PlayerCard key={p.id} p={p} kind="QB" ctx={ctx} />)}

            <SectionTitle right={`vs ${def.abbr} secondary · ${ordinal(defRow?.rankPass)}`}>⚡ Receivers &amp; Tight Ends</SectionTitle>
            {groups.REC.map((p) => <PlayerCard key={p.id} p={p} kind="REC" ctx={ctx} />)}

            <SectionTitle right={`vs ${def.abbr} run D · ${ordinal(defRow?.rankRun)}`}>🏃 Running Backs</SectionTitle>
            {groups.RB.map((p) => <PlayerCard key={p.id} p={p} kind="RB" ctx={ctx} />)}

            <SectionTitle right={`vs ${off.abbr} offense · ${ordinal(defRow?.rankOffense)} scoring`}>🛡 {def.abbr} Defenders</SectionTitle>
            {groups.DEF.map((p) => <PlayerCard key={p.id} p={p} kind="DEF" ctx={ctx} />)}

            <div style={{ fontSize: 10, color: T.inkFaint, lineHeight: 1.6, padding: "4px 0 22px" }}>
              Projections are a season per-game baseline times the factor chain shown on each card.
              Matchup uses league rank, capped at ±{Math.round(MATCHUP_SPREAD * 100)}%. Kickoff script and
              defense-vs-archetype are declared but not yet modeled. Price everything against your book's line.
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const now = new Date();
  const defaultYear = now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear();
  const [year, setYear] = useState(defaultYear);
  const [seasonType, setSeasonType] = useState(2);
  const [week, setWeek] = useState(null);
  const [sched, setSched] = useState({ games: [], byes: [] });
  const [selected, setSelected] = useState(null);
  const [league, setLeague] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [scan, setScan] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [progress, setProgress] = useState("");
  const scanKey = useRef("");

  useEffect(() => {
    (async () => {
      const d = await safeJSON(`${ESPN}/scoreboard`);
      setWeek(d?.week?.number || 1);
      if (d?.season?.year) setYear(d.season.year);
      if (d?.season?.type) setSeasonType(d.season.type);
    })();
  }, []);

  useEffect(() => { getLeagueDefense(defaultYear).then(setLeague); }, [defaultYear]);

  useEffect(() => {
    if (!week) return;
    setLoading(true); setError(null); setSelected(null);
    getSchedule(year, week, seasonType)
      .then((s) => { setSched(s); setLoading(false); })
      .catch((e) => { setError(e.message); setLoading(false); });
  }, [year, week, seasonType]);

  const doScan = useCallback(async (force) => {
    if (!league || !week) return;
    const key = `${year}-${week}-${seasonType}-${league.season}`;
    if (!force && scanKey.current === key) return;
    scanKey.current = key;
    /* A forced rescan must drop cached responses, otherwise every fetch is
       served from memory and the button does nothing visible. */
    if (force) clearCache();
    setScanning(true); setScan(null);
    try {
      const result = await runScan({
        year, week, seasonType, league, onProgress: setProgress,
      });
      setScan(result);
    } catch (e) {
      setScan({ rows: [], error: e.message });
    }
    setScanning(false);
  }, [league, week, year, seasonType]);

  useEffect(() => { doScan(false); }, [doScan]);

  const weeks = seasonType === 2 ? 18 : 5;

  return (
    <div className="field gx-app" style={{
      fontFamily: "'Inter',sans-serif", height: "100vh", display: "flex", flexDirection: "column",
    }}>
      <div className="gx-header" style={{
        padding: "11px 18px", display: "flex", alignItems: "center", gap: 14,
        background: "linear-gradient(180deg, rgba(10,45,26,.95), rgba(10,45,26,.72))",
        borderBottom: `2px solid ${T.chalk}`, flexShrink: 0, flexWrap: "wrap",
        boxShadow: `0 3px 0 ${T.leatherDark}, 0 8px 20px rgba(0,0,0,.4)`, zIndex: 2,
      }}>
        <div onClick={() => setSelected(null)} style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 25, fontWeight: 700,
          letterSpacing: 2.5, color: T.gold, cursor: "pointer",
          textShadow: `0 2px 0 ${T.leatherDark}, 0 4px 10px rgba(0,0,0,.55)`,
        }}>🏈 GRIDIRON EDGE</div>
        <div className="gx-tagline" style={{ color: T.inkDim, fontSize: 10, letterSpacing: 1.4, paddingTop: 3 }}>
          NFL MATCHUP ANALYSIS · APOLLO MEDIA
        </div>
        <div title="Build version — check this after updating the file" style={{
          fontSize: 9, color: T.inkFaint, border: `1px solid ${T.chalkFaint}`,
          borderRadius: 3, padding: "2px 6px", letterSpacing: .5, whiteSpace: "nowrap",
        }}>{BUILD}</div>
        <div className="gx-controls" style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <select value={seasonType} onChange={(e) => { setSeasonType(+e.target.value); setWeek(1); }}>
            <option value={2}>Regular season</option>
            <option value={3}>Postseason</option>
          </select>
          <select value={week || 1} onChange={(e) => setWeek(+e.target.value)}>
            {Array.from({ length: weeks }, (_, i) => i + 1).map((w) =>
              <option key={w} value={w}>Week {w}</option>)}
          </select>
          <select value={year} onChange={(e) => setYear(+e.target.value)}>
            {[defaultYear, defaultYear - 1, defaultYear - 2].map((y) =>
              <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>

      <div className="gx-shell" style={{ display: "flex", flex: 1, overflow: "hidden" }}>
        <div className="gx-side" style={{
          width: 224, borderRight: `2px solid ${T.chalkDim}`, overflowY: "auto",
          padding: "10px 0", flexShrink: 0, background: "rgba(0,0,0,.26)",
        }}>
          <button className="game-btn" onClick={() => setSelected(null)} style={{
            width: "100%", textAlign: "left", padding: "8px 12px", cursor: "pointer",
            background: !selected ? "rgba(255,199,44,.15)" : "transparent",
            border: `1px solid ${!selected ? T.gold : "transparent"}`,
            borderLeft: `3px solid ${!selected ? T.gold : "transparent"}`,
            borderRadius: 3, color: T.ink, marginBottom: 6,
            fontFamily: "'Barlow Condensed',sans-serif", fontSize: 15,
            fontWeight: 700, letterSpacing: 1.2,
          }}>📋 EDGE BOARD</button>

          <div style={{
            padding: "0 12px 8px", fontSize: 9.5, color: T.inkFaint,
            letterSpacing: 1.4, fontWeight: 600,
          }}>{loading ? "LOADING…" : `${sched.games.length} GAMES`}</div>
          {error && <div style={{ padding: "12px", color: T.poor, fontSize: 11 }}>Error: {error}</div>}
          {sched.games.map((g) => {
            const sel = selected?.id === g.id;
            const d = new Date(g.date);
            return (
              <button key={g.id} className="game-btn" onClick={() => setSelected(g)} style={{
                width: "100%", textAlign: "left",
                background: sel ? "rgba(255,199,44,.15)" : "transparent",
                border: `1px solid ${sel ? T.gold : "transparent"}`,
                borderLeft: `3px solid ${sel ? T.gold : "transparent"}`,
                borderRadius: 3, padding: "8px 12px", cursor: "pointer",
                color: T.ink, marginBottom: 1, fontFamily: "'Inter',sans-serif",
              }}>
                <div style={{
                  fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6,
                  opacity: g.state === "post" ? .55 : 1,
                }}>
                  {g.away.abbr} <span style={{ color: T.inkFaint, fontSize: 10.5, fontWeight: 400 }}>at</span> {g.home.abbr}
                  {g.state === "in" && <span style={{
                    width: 6, height: 6, borderRadius: "50%", background: T.gold, display: "inline-block",
                  }}/>}
                  {g.state === "post" && <span style={{ fontSize: 9, color: T.inkFaint }}>🔒</span>}
                </div>
                <div style={{ fontSize: 10, color: T.inkFaint, marginTop: 2 }}>
                  {g.state === "post"
                    ? `FINAL ${g.away.score}–${g.home.score}`
                    : <>
                        {d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}
                        {" · "}{d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}
                      </>}
                </div>
              </button>
            );
          })}
          {!loading && sched.byes.length > 0 && (
            <div style={{ padding: "12px", borderTop: `1px solid ${T.chalkFaint}`, marginTop: 8 }}>
              <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: 1, marginBottom: 5 }}>ON BYE</div>
              <div style={{ fontSize: 11, color: T.inkDim, lineHeight: 1.6 }}>{sched.byes.join(" · ")}</div>
            </div>
          )}
        </div>

        <div className="gx-main" style={{ flex: 1, overflowY: "auto", padding: 18 }}>
          {!league && (
            <div className="pulsing" style={{
              textAlign: "center", padding: 60, color: T.inkDim,
              fontFamily: "'Barlow Condensed',sans-serif", fontSize: 17, letterSpacing: 2.5,
            }}>LOADING LEAGUE DEFENSIVE RANKS…</div>
          )}
          {league && !selected && (
            <Scanner scan={scan} scanning={scanning} progress={progress} league={league}
              week={week} onOpen={setSelected} onRescan={() => doScan(true)} />
          )}
          {league && selected && (
            <GameView key={selected.id} game={selected} league={league} onBack={() => setSelected(null)} />
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
